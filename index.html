function stageBar(b,it){
  const st=BOARD_META[b].stage; if(!st) return '';
  const col=colById(b,st.col); const cur=it.v[st.col];
  const lab=id=>col.labels.find(l=>l.id===id);
  let steps=st.steps.map(lab).filter(Boolean);
  const curIdx=steps.findIndex(l=>l.id===cur);
  let fin=null;
  if(b==='deals'){fin=lab(cur==='lost'?'lost':'won')}
  else fin={id:'_closed',name:cur==='nq'?'Nicht qualifiziert':'Abgeschlossen',color:cur==='nq'?'grey':'dgreen'};
  const finalReached=b==='deals'?['won','lost'].includes(cur):(cur==='qual'&&it.v.converted)||cur==='nq';
  const fillColor=b==='deals'&&cur==='lost'?colorOf('red'):b==='leads'&&cur==='nq'?colorOf('grey'):colorOf(b==='deals'?'green':'dgreen');
  const html=steps.map((l,i)=>{const done=finalReached||i<=curIdx;return `<button class="stage ${done?'done':''}" style="${done?'background:'+fillColor:''}" data-act="dstage" data-v="${esc(l.id)}">${esc(l.name)}</button>`}).join('')+(fin?`<button class="stage ${finalReached?'done':''}" style="${finalReached?'background:'+fillColor:''}" data-act="dstagefinal">${esc(fin.name)}</button>`:'');
  const extra=b==='leads'?`<div style="display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px"><button class="btn out" data-act="dstage" data-v="nq">Nicht qualifiziert</button><button class="btn out" data-act="dstage" data-v="neu">Neues Lead</button></div>`:(b==='deals'&&finalReached?`<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn out" data-act="dstage" data-v="suche">Erneut öffnen</button></div>`:'');
  return `<div class="card" style="margin-bottom:16px"><div class="cb">${extra}<div class="stagebar">${html}</div></div></div>`;
}

// Führt Kontakt d in k zusammen: leere Felder ergänzen, Verknüpfungen umhängen, d entfernen
function mergeContacts(keepId,dropId){
  const k=get('contacts',keepId),d=get('contacts',dropId); if(!k||!d||k===d) return;
  for(const [key,val] of Object.entries(d.v)){
    if(val===''||val==null||(Array.isArray(val)&&!val.length)) continue; const cur=k.v[key];
    if(Array.isArray(val)) k.v[key]=[...new Set([...(cur||[]),...val])];
    else if(key==='comments'){if(!String(cur||'').includes(val))k.v[key]=[cur,val].filter(Boolean).join('\n\n')}
    else if(key==='last'){if(val>(cur||''))k.v[key]=val}
    else if(cur===''||cur==null) k.v[key]=val;
  }
  k.updates=[...(k.updates||[]),...(d.updates||[]).filter(u=>u.kind!=='sys')].sort((a,b)=>String(b.ts).localeCompare(String(a.ts))).slice(0,150);
  if((d.subitems||[]).length) k.subitems=[...(k.subitems||[]),...d.subitems];
  addUpdate(k,'sys',`Dublette „${d.name}“ zusammengeführt`); k.updated=nowISO(); persist('contacts',k.id);
  const from='contacts:'+d.id, to='contacts:'+k.id;
  for(const a of items('activities')) if((a.v.rel||[]).includes(from)){a.v.rel=[...new Set(a.v.rel.map(x=>x===from?to:x))];persist('activities',a.id)}
  for(const p of items('deals')) for(const f of ['contacts','candidates']) if((p.v[f]||[]).includes(d.id)){p.v[f]=[...new Set(p.v[f].map(x=>x===d.id?k.id:x))];persist('deals',p.id)}
  for(const p of items('deals')) if(p.slist&&p.slist[d.id]){if(!p.slist[k.id])p.slist[k.id]=p.slist[d.id];delete p.slist[d.id];persist('deals',p.id)}
  for(const l of items('leads')) if(l.v.converted===d.id){l.v.converted=k.id;persist('leads',l.id)}
  S.items.contacts.delete(d.id); persistDelete('contacts',d.id); UI.sel.delete('contacts:'+d.id);
  if(UI.detail&&UI.detail.id===d.id) UI.detail={b:'contacts',id:k.id};
  render(); toast(`„${d.name}“ in „${k.name}“ zusammengeführt`);
}

/* ---------- Angebote & Rechnungen ---------- */
const QSTAT={Angebot:['Entwurf','Versendet','Angenommen','Abgelehnt'],Rechnung:['Entwurf','Gestellt','Bezahlt','Storniert']};
// ältere Einträge ohne Art: über den Status erkennen
const qType=q=>q.typ||(/Rechnung|Bezahlt/.test(q.status||'')?'Rechnung':'Angebot');
const qStatus=q=>q.status==='Rechnung gestellt'?'Gestellt':(q.status||'Entwurf');
// Rechnungsnummern laufen fortlaufend über alle Projekte (z. B. 146, 147 …)
function nextInvoiceNr(){let max=0;for(const d of items('deals'))for(const q of d.quotes||[])if(qType(q)==='Rechnung'&&/^\d{1,6}$/.test(String(q.nr).trim()))max=Math.max(max,+q.nr);return max?String(max+1):''}
function detailQuotes(b,it){
  const qs=it.quotes||[]; const sum=f=>qs.filter(f).reduce((s,q)=>s+(+q.amount||0),0);
  const ang=sum(q=>qType(q)==='Angebot'&&qStatus(q)!=='Abgelehnt');
  const re=sum(q=>qType(q)==='Rechnung'&&['Gestellt','Bezahlt'].includes(qStatus(q))), paid=sum(q=>qType(q)==='Rechnung'&&qStatus(q)==='Bezahlt');
  const rows=qs.map((q,i)=>{const t=qType(q),st=qStatus(q),od=t==='Rechnung'&&st==='Gestellt'&&q.due&&q.due<todayISO();return `<tr>
    <td><select data-q="${i}" data-k="typ">${['Angebot','Rechnung'].map(x=>`<option ${x===t?'selected':''}>${x}</option>`).join('')}</select></td>
    <td><input value="${esc(q.nr||'')}" data-q="${i}" data-k="nr" placeholder="${t==='Rechnung'?'z. B. 147':''}"></td>
    <td><input value="${esc(q.title||'')}" data-q="${i}" data-k="title" style="min-width:200px"></td>
    <td><input type="number" value="${esc(q.amount)}" data-q="${i}" data-k="amount"></td>
    <td><input type="date" value="${esc(q.date||'')}" data-q="${i}" data-k="date"></td>
    <td>${t==='Rechnung'?`<input type="date" value="${esc(q.due||'')}" data-q="${i}" data-k="due" class="${od?'overdue':''}">`:''}</td>
    <td>${t==='Rechnung'?`<input type="date" value="${esc(q.paid||'')}" data-q="${i}" data-k="paid" title="Datum des Geldeingangs">`:''}</td>
    <td><select data-q="${i}" data-k="status">${QSTAT[t].map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select></td>
    <td><button class="btn danger" data-act="qdel" data-i="${i}" aria-label="Löschen">${ic('trash')}</button></td></tr>`}).join('');
  return `<div class="card"><div class="ch"><h2>Angebote & Rechnungen</h2><span class="badge">${qs.length}</span><span style="margin-left:auto"></span><button class="btn out" data-act="qadd">${ic('plus')} Angebot</button><button class="btn pri" data-act="qaddre">${ic('plus')} Rechnung</button></div><div class="cb" style="overflow-x:auto">${qs.length?`<table class="mini"><thead><tr><th>Art</th><th>Nummer</th><th>Bezeichnung</th><th>Betrag netto (€)</th><th>Datum</th><th>Fällig am</th><th>Geldeingang</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>
   <p class="hint">Honorar laut Projekt: ${fmtMoney(it.v.value)||'–'} · angeboten: ${fmtMoney(ang)||'0 €'} · berechnet: ${fmtMoney(re)||'0 €'} · bezahlt: ${fmtMoney(paid)||'0 €'} · <b>offen: ${fmtMoney(re-paid)||'0 €'}</b></p>`:'<div class="empty">Noch keine Angebote oder Rechnungen zu diesem Projekt. Typisch im Executive Search: Angebot, dann Rechnungen für die Honorarraten.</div>'}</div></div>`;
}

function slAdd(p,cid){

  if(c.v.kand!=='ja'||!c.v.kstatus){c.v.kand='ja';c.v.kstatus=c.v.kstatus||'ident';persist('contacts',c.id)}

function slSet(p,cid,patch){

/* ---------- CSV ---------- */
function csvCell(b,it,c){
  if(c==='name') return it.name; const col=colById(b,c); const v=it.v[c];
  if(col.type==='status'){const l=labelOf(b,c,v);return l?l.name:''}
  if(col.type==='link'||col.type==='rlink') return linkIds(b,it,col).map(id=>nameOf(col.target,id)).join('; ');
  if(col.type==='relany') return (v||[]).map(r=>{const [rb,rid]=r.split(':');return nameOf(rb,rid)}).filter(Boolean).join('; ');
  if(col.type==='seqs') return it.seq?it.seq.name:'';
  if(col.type==='timeline') return actsOf(b,it.id).length;
  if(RO_TYPES.has(col.type)) return computed(b,it,col);
  if(Array.isArray(v)) return v.join('; ');
  return v??'';
}
function toCSV(b,list){
  const cs=cols(b); const q=s=>{s=String(s??'');return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const head=[BOARD_META[b].nameLabel,'Gruppe',...cs.map(c=>c.name)];
  const rows=list.map(it=>[it.name,(bcfg(b).groups.find(g=>g.id===it.group)||{}).name||'',...cs.map(c=>csvCell(b,it,c.id))]);
  return '﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n');
}
async function saveFile(filename,data){
  if(!S.dl){toast('Download ist in dieser Ansicht nicht verfügbar.');return}
  try{await S.dl.save({filename,data});}catch(e){if(e&&e.code!=='declined')toast('Download nicht möglich.')}
}
function parseCSV(text){
  text=text.replace(/^﻿/,''); const first=text.split(/\r?\n/)[0]||''; const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':(first.includes('\t')?'\t':',');
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else inQ=false}else cur+=ch}
    else if(ch==='"') inQ=true; else if(ch===sep){row.push(cur);cur=''} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''} else cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}

    m.querySelector('#i-f').onchange=async e=>{const f=e.target.files[0];if(!f)return;rows=parseCSV(await f.text());if(rows.length<2){m.querySelector('#i-map').innerHTML='<p class="hint">Keine Datenzeilen gefunden.</p>';return}
      m.querySelector('#i-map').innerHTML=`<p class="hint">${rows.length-1} Zeilen erkannt. Zuordnung:</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 10px">${rows[0].map((h,i)=>`<span style="align-self:center">${esc(h)}</span><select data-i="${i}">${opts.map(([k,l])=>`<option value="${k}" ${guess(h)===k?'selected':''}>${esc(l)}</option>`).join('')}</select>`).join('')}</div>`;m.querySelector('#i-go').disabled=false};
    m.querySelector('#i-go').onclick=()=>{if(!rows)return;const map={};m.querySelectorAll('[data-i]').forEach(s=>{if(s.value)map[+s.dataset.i]=s.value});
      if(!Object.values(map).some(v=>v==='name'||v==='_vn'||v==='_nn')){toast('Bitte eine Spalte als Name zuordnen.');return}
      let n=0;
      for(const r of rows.slice(1)){let name='',vn='',nn='';const v={};
        for(const [i,k] of Object.entries(map)){const val=(r[+i]||'').trim();if(!val)continue;if(k==='name')name=val;else if(k==='_vn')vn=val;else if(k==='_nn')nn=val;else{const col=colById(b,k);
          if(col.type==='status'){let l=col.labels.find(l=>l.name.toLowerCase()===val.toLowerCase());if(!l){l={id:uid(),name:val,color:Object.keys(COLORS)[col.labels.length%18]};col.labels.push(l)}v[k]=l.id}
          else if(['number','money','percent'].includes(col.type)) v[k]=+val.replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.')||'';
          else if(col.type==='tags') v[k]=val.split(/[;,]/).map(s=>s.trim()).filter(Boolean);
          else if(col.type==='link'){v[k]=val.split(/;/).map(s=>s.trim()).filter(Boolean).map(nm=>{const t=items(col.target).find(x=>x.name.toLowerCase()===nm.toLowerCase());return t?t.id:newItem(col.target,nm).id})}
          else if(col.type==='date'){const dm=val.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);v[k]=dm?`${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`:val.slice(0,10)}
          else v[k]=val}}

  bseq(){seqModal(selList().filter(x=>x[0]===UI.view))},
  bscore(){aiScore(selList().filter(x=>x[0]==='leads').map(x=>x[1]))},
  bconv(){const l=selList().filter(x=>x[0]==='leads');const done=l.filter(([,id])=>convertLead(id,{silent:true})).length;const skip=l.length-done;UI.sel.clear();render();toast(`${done} Leads in Kontakte übernommen`+(skip?` · ${skip} mit möglichem Duplikat übersprungen, bitte einzeln übernehmen`:''))},
  dupscan(){dupScanModal()},
  async authsetpin(){const a=$('#pin1').value.trim(),b=$('#pin2').value.trim();if(!/^\d{6,12}$/.test(a)){toast('Die PIN muss aus 6 bis 12 Ziffern bestehen.');return}if(a!==b){toast('Die beiden PINs stimmen nicht überein.');return}
    const r=await window.crmTools.auth.setPin(a);if(!r.ok){toast(r.error||'PIN konnte nicht gespeichert werden.');return}$('#pin1').value='';$('#pin2').value='';UI.auth=null;toast('PIN gespeichert. Bisher angemeldete Geräte sind abgemeldet.');render()},
  authrevoke(){confirmBox('Alle Handys und Tablets abmelden? Sie müssen sich danach mit der PIN neu anmelden.','Abmelden',async()=>{await window.crmTools.auth.revoke();UI.auth=null;toast('Alle Geräte abgemeldet.');render()})},
  authlogout(){window.crmTools.auth.logout()},
  scan(el){scanModal(el.dataset.b||'contacts')},
  dscantext(){const ta=$('#d-paste');const t=ta&&ta.value.trim();if(t&&UI.scanRun){ta.value='';UI.scanRun(extractText(t))}},
  dscanol(){const x=$('#d-scanres');if(x)x.textContent='Markierte E-Mail wird gelesen…';if(UI.scanRun)UI.scanRun(window.crmTools.selected().then(j=>extractMail(j,'Outlook-Mail')))},
  dupmerge(el){mergeContactModal(el.dataset.a,el.dataset.z)},
  addrcopy(){const it=get('accounts',UI.detail.id);if(!it)return;const v=it.v;const t=[it.name,v.street,[v.zip,v.city].filter(Boolean).join(' '),v.country].filter(Boolean).join('\n');navigator.clipboard.writeText(t).then(()=>toast('Adresse kopiert'),()=>toast('Kopieren nicht möglich'))},
  flag(el){S.cfg.flags[el.dataset.f]=!S.cfg.flags[el.dataset.f];saveCfg();render()},
  autotoggle(el){const r=S.cfg.automations.find(x=>x.id===el.dataset.id);if(r){r.on=!r.on;saveCfg();render()}},
  autoedit(el){autoModal(S.cfg.automations.find(x=>x.id===el.dataset.id))},
  autodel(el){S.cfg.automations=S.cfg.automations.filter(x=>x.id!==el.dataset.id);saveCfg();render()},
  newauto(){autoModal(null)},
  newseq(){S.cfg.sequences.push({id:uid(),name:'Neue Sequenz',steps:[{day:0,kind:'mail',subject:'',body:'{{Briefanrede}},\n\n\n\nBeste Grüße\nSven Braun'}]});saveCfg();render()},
  seqdel(el){const s=S.cfg.sequences.find(x=>x.id===el.dataset.id);confirmBox(`Sequenz „${s.name}“ löschen? Bereits angelegte Aktivitäten bleiben bestehen.`,'Löschen',()=>{S.cfg.sequences=S.cfg.sequences.filter(x=>x!==s);saveCfg();render()})},
  stepadd(el){const s=S.cfg.sequences.find(x=>x.id===el.dataset.id);const last=s.steps[s.steps.length-1];s.steps.push({day:(last?+last.day:0)+4,kind:'mail',subject:'',body:'{{Briefanrede}},\n\n\n\nBeste Grüße\nSven Braun'});saveCfg();render()},
  stepdel(el){const s=S.cfg.sequences.find(x=>x.id===el.dataset.id);s.steps.splice(+el.dataset.i,1);saveCfg();render()},
  newtpl(){S.cfg.templates.push({id:uid(),name:'Neue Vorlage',subject:'',body:'{{Briefanrede}},\n\n\n\nBeste Grüße\nSven Braun'});saveCfg();render()},
  tpldel(el){S.cfg.templates=S.cfg.templates.filter(x=>x.id!==el.dataset.id);saveCfg();render()},
  chatsend(){sendChat()},
  chatclear(){if(chatCtl)chatCtl.abort();UI.chat=[];render()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act; if(!ACT[a]) return;
  if(el.tagName!=='INPUT') e.preventDefault();
  ACT[a](el,e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.seq){const s=S.cfg.sequences.find(x=>x.id===t.dataset.seq);if(!s)return;const st=s.steps[+t.dataset.i];st[t.dataset.k]=t.dataset.k==='day'?+t.value:t.value;if(t.dataset.k==='kind'&&t.value==='mail'&&!st.body)st.body='{{Briefanrede}},\n\n\n\nBeste Grüße\nSven Braun';saveCfg();if(t.dataset.k==='kind')render()}
  if(t.dataset.seqname){const s=S.cfg.sequences.find(x=>x.id===t.dataset.seqname);if(s&&t.value.trim()){s.name=t.value.trim();saveCfg()}}
  if(t.dataset.tpl){const tp=S.cfg.templates.find(x=>x.id===t.dataset.tpl);if(tp){tp[t.dataset.k]=t.value;saveCfg()}}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='leadform') return; e.preventDefault();
  const g=id=>document.getElementById(id).value.trim();
  const nm={akad:g('lf-akad'),vorname:g('lf-vn'),nachname:g('lf-nn')};
  const it=newItem('leads',composeName(nm),'neu',{...nm,salutation:g('lf-sal'),company:g('lf-company'),title:g('lf-title'),email:g('lf-email'),phone:g('lf-phone'),linkedin:g('lf-li'),source:g('lf-src'),notes:g('lf-notes'),last:todayISO()});
  e.target.reset(); render(); toast(`Lead „${it.name}“ gespeichert`,'Öffnen',()=>openDetail('leads',it.id));
});

/* ---------- Start & Datenbank ---------- */
let loadTimer=null;
function subscribe(){
  const pending=new Set([...BOARDS_ORDER,'meta']);
  const settle=k=>{pending.delete(k);if(!pending.size){clearTimeout(loadTimer);S.conn='ok';migrateNames();render()}};
  loadTimer=setTimeout(()=>{if(pending.size){S.conn='slow';render()}},10000);
  for(const b of BOARDS_ORDER){
    S.db.collection(b).onSnapshot(snap=>{
      const m=new Map(); for(const d of snap.docs){const x=d.data();if(!x)continue;const it=JSON.parse(JSON.stringify(x));it.id=d.id;it.v=it.v||{};m.set(d.id,it)}
      S.items[b]=m; S.ver++; if(!snap.metadata.fromCache) settle(b); render();
    },err=>{console.error(err);S.conn='err';clearTimeout(loadTimer);render()});
  }
  S.db.doc('meta/config').onSnapshot(snap=>{
    if(snap.exists&&!cfgPending){S.cfg=normalizeCfg(snap.data());S.ver++;if((snap.data().ver||1)<CFG_VER)saveCfg()}
    if(!snap.metadata.fromCache) settle('meta'); render();
  },err=>{console.error(err);S.conn='err';render()});
}
async function init(){
  render();
  const cl=window.claude;
  if(!cl||!cl.use){S.conn='local';render();return}
  const [db,sample,mcp,dl]=await Promise.all(['db','sample','mcp','downloads'].map(n=>cl.use(n).catch(()=>null)));
  S.sample=sample; S.mcp=mcp; S.dl=dl;
  if(db){S.db=db;subscribe()} else {S.conn='local'}
  if(mcp&&mcp.sync){setTimeout(()=>mailSync(),4000);setInterval(()=>mailSync(),10*60*1000)}
  render();
}
init();
</script>
