<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Braun CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0a6f78"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Braun CRM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: linke Navigationsleiste + Arbeitsfläche; Boards als gruppierte Tabellen, Detailansicht als Seitenpanel */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#f9fafb; --fg:#1d2330; --muted:#646c7a; --faint:#9aa1ad;
  --line:#e2e6eb; --line-2:#eef0f3; --hover:#eef2f5; --accent:#0a6f78; --accent-fg:#ffffff; --accent-weak:#e2f1f2;
  --danger:#c9283f; --warn:#b26a00; --ok:#0c8a55; --shadow:0 8px 28px rgba(20,30,45,.14);
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161b; --surface:#1b1f26; --surface-2:#20252d; --fg:#e7e9ee; --muted:#a0a7b3; --faint:#6f7784;
  --line:#2d333c; --line-2:#262b33; --hover:#252b33; --accent:#3cb0b9; --accent-fg:#0d1a1c; --accent-weak:#1b3437;
  --danger:#ff6b7f; --warn:#f0a43a; --ok:#3fd18f; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1b1f26; --surface-2:#20252d; --fg:#e7e9ee; --muted:#a0a7b3; --faint:#6f7784;
  --line:#2d333c; --line-2:#262b33; --hover:#252b33; --accent:#3cb0b9; --accent-fg:#0d1a1c; --accent-weak:#1b3437;
  --danger:#ff6b7f; --warn:#f0a43a; --ok:#3fd18f; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
svg[viewBox="0 0 24 24"]{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none;vertical-align:middle}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:grid;grid-template-columns:212px minmax(0,1fr);height:100%}
nav.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 10px;overflow-y:auto;padding-left:max(10px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--font-display);font-size:19px;padding:4px 10px 14px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--font-ui);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.navlbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:12px 10px 4px}
.navbtn{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);color:var(--fg);text-align:left;width:100%}
.navbtn:hover{background:var(--hover)}
.navbtn.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.navbtn svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.navbtn .cnt{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--danger)}
main{min-width:0;overflow:auto;padding-block:20px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  nav.rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));align-items:center}
  .brand,.navlbl,.rail-foot{display:none}
  .navbtn{width:auto;white-space:nowrap}
  .navbtn .cnt{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
h1{font-family:var(--font-display);font-weight:600;font-size:28px;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:700;margin:0}
.muted{color:var(--muted)}.small{font-size:12px}
.bh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bh .meta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 14px;overflow-x:auto}
.tab{padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r);color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.btn.pri{background:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.out{border:1px solid var(--line);background:var(--surface)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.act{background:var(--accent-weak);color:var(--accent)}
.badge{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--hover);color:var(--muted);font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;background:var(--surface)}
.search input{border:0;outline:0;background:none;width:150px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:var(--r);background:var(--accent-weak);margin-bottom:14px;font-size:13px}
.banner.warn{background:color-mix(in srgb,var(--warn) 16%,transparent)}
/* Board-Tabelle */
.group{margin-bottom:30px}
.ghead{display:flex;align-items:center;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.gname{font-size:17px;font-weight:600;padding:2px 4px;border-radius:4px}
.gname:hover{background:var(--hover)}
.gtoggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .15s}
.gtoggle.closed svg{transform:rotate(-90deg)}
/* Tabelle scrollt in einem Rahmen in Fensterhöhe: der waagerechte Regler bleibt immer sichtbar, die Kopfzeile bleibt stehen */
.tw{overflow:auto;border-radius:var(--r);max-height:max(320px,calc(100vh - 210px))}
.tw::-webkit-scrollbar{height:12px;width:12px}
.tw::-webkit-scrollbar-thumb{background:var(--faint);border-radius:6px;border:2px solid var(--bg)}
.tw::-webkit-scrollbar-track{background:var(--line-2)}
.bt thead th{position:sticky;top:0;z-index:3}
.bt thead th:first-child,.bt thead th:nth-child(2){z-index:4}
table.bt{border-collapse:separate;border-spacing:0;min-width:100%;background:var(--surface);font-variant-numeric:tabular-nums}
.bt th,.bt td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:38px;padding:0;text-align:center;white-space:nowrap;font-weight:400}
.bt th{font-size:13px;color:var(--muted);padding:0 10px;background:var(--surface);border-top:1px solid var(--line);position:relative}
.bt th.colh{cursor:pointer}
.bt th.colh:hover{background:var(--hover)}
.bt th:first-child,.bt td:first-child{border-left:5px solid var(--gc,var(--accent));position:sticky;left:0;z-index:2;width:38px;min-width:38px;background:var(--surface)}
.bt th:nth-child(2),.bt td:nth-child(2){position:sticky;left:38px;z-index:2;background:var(--surface);text-align:left;min-width:260px;max-width:340px}
.bt tr:hover td{background:var(--surface-2)}
.bt tr.sel td{background:var(--accent-weak)}
.bt td.c{min-width:130px;max-width:240px;overflow:hidden;text-overflow:ellipsis;padding:0 8px;cursor:pointer}
.bt td.c.ro{cursor:default}
.bt td.c.wide{min-width:220px}
.bt td.st{padding:0;min-width:140px}
.namecell{display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;height:38px}
.namecell .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;cursor:text;padding:3px 4px;border-radius:4px}
.namecell .nm:hover{outline:1px solid var(--line)}
.openbtn{opacity:.55;padding:4px;border-radius:4px;display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.openbtn:hover{opacity:1;background:var(--hover)}
.openbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.addrow td{height:36px}
.addrow input{border:0;outline:0;background:none;width:100%;padding:0 14px;height:36px;color:var(--fg)}
.sumrow td{border-left-color:transparent!important;background:var(--bg)!important;font-size:12px;color:var(--muted);height:44px}
.sumrow td:first-child,.sumrow td:nth-child(2){background:var(--bg)!important;border-right-color:transparent;border-bottom-color:transparent}
.distbar{display:flex;height:22px;margin:0 8px;border-radius:2px;overflow:hidden}
.distbar span{display:block;height:100%}
.chk{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.lbl{display:flex;align-items:center;justify-content:center;width:100%;height:38px;color:#fff;font-weight:500;font-size:13px;padding:0 8px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.lbl.empty{background:transparent;color:var(--faint)}
.lbl.dark{color:#262a33}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;background:var(--accent-weak);color:var(--fg);font-size:12.5px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.chip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
.chip.link{cursor:pointer}
.chips{display:inline-flex;gap:4px;align-items:center;max-width:100%;overflow:hidden}
.more{font-size:11px;background:var(--fg);color:var(--surface);border-radius:9px;padding:1px 6px}
.tl{display:inline-flex;gap:2px;align-items:center}
.tl i{display:block;width:6px;height:16px;border-radius:2px;background:var(--line)}
.tl i.f{background:var(--accent)}
.tl .plus{margin-left:6px;width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.tl .plus:hover{background:var(--hover);color:var(--fg)}
.convbtn{background:#037f4c;color:#fff;font-weight:600;font-size:12.5px;padding:5px 10px;border-radius:4px}
.convbtn.done{background:var(--hover);color:var(--muted);font-weight:500}
.overdue{color:var(--danger);font-weight:600}
.lnk{color:var(--accent)}
/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.kcol{flex:0 0 260px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.khead{padding:9px 12px;color:#fff;font-weight:600;border-radius:var(--r) var(--r) 0 0;display:flex;justify-content:space-between;gap:8px}
.khead.dark{color:#262a33}
.kbody{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px}
.kbody.over{background:var(--accent-weak)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:grab;display:flex;flex-direction:column;gap:5px}
.kcard:hover{border-color:var(--accent)}
.kcard .t{font-weight:600}
.kcard .r{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
/* Popover, Modals, Detail */
.pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:10px;min-width:200px;max-width:min(360px,calc(100vw - 24px));max-height:min(460px,calc(100vh - 24px));overflow:auto}
.pop .lblopt{display:block;width:100%;color:#fff;padding:7px 10px;margin-bottom:5px;border-radius:3px;text-align:center;font-weight:500}
.pop .lblopt.dark{color:#262a33}
.pop .lblopt.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.pop .row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer;width:100%;text-align:left}
.modal .row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:4px}
.modal label.row{cursor:pointer}
.modal label.row:hover{background:var(--hover)}
.pop .row:hover{background:var(--hover)}
.pop hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.pop input[type=text],.pop input[type=search],.pop textarea,.pop select{width:100%;border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--surface)}
.pop textarea{min-height:120px;resize:vertical}
.pop h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 0 8px;font-weight:600}
.swatch{width:22px;height:22px;border-radius:4px;flex:none;border:2px solid transparent}
.swatch.cur{border-color:var(--fg)}
.inl{position:fixed;z-index:85;border:2px solid var(--accent);background:var(--surface);padding:0 8px;outline:0;border-radius:3px}
.backdrop{position:fixed;inset:0;background:rgba(10,14,20,.38);z-index:60}
.modal{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:20px}
.modal h2{font-size:18px;margin-bottom:14px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:5px;padding:7px 9px;background:var(--surface);color:var(--fg);font-size:14px;width:100%}
.form textarea{min-height:140px;resize:vertical;line-height:1.5}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.form .two{grid-template-columns:1fr}}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.detail{position:fixed;z-index:65;top:0;right:0;bottom:0;width:min(1180px,100vw);background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dhead{background:var(--surface);border-bottom:1px solid var(--line);padding:14px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.dtitle{display:flex;gap:10px;align-items:center}
.dtitle input{font-family:var(--font-display);font-size:24px;font-weight:600;border:1px solid transparent;border-radius:5px;padding:2px 6px;background:none;flex:1;min-width:0}
.dtitle input:hover,.dtitle input:focus{border-color:var(--line);outline:0}
.dbody{flex:1;overflow:auto;padding:18px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.stagebar{display:flex;gap:3px;margin:4px 0 0;overflow-x:auto}
.stage{flex:1 0 110px;padding:8px 14px;background:var(--line);color:var(--muted);font-weight:500;font-size:13px;text-align:center;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%,9px 50%);white-space:nowrap}
.stage:first-child{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%)}
.stage.done{color:#fff}
.stage:hover{filter:brightness(1.05)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:900px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dgrid>*{min-width:0}
/* Handy: Detailansicht kompakter, größere Tippflächen */
@media (max-width:640px){
  .dhead{padding:10px 12px 0}
  .dtitle input{font-size:19px}
  .dtitle .btn{padding:8px}
  .detail .tabs>span.muted{display:none}
  .dbody{padding:12px 12px 40px;overflow-x:hidden}
  .fi .tx{overflow-wrap:anywhere}
  .card>.cb{padding:12px}
  .card>.ch .btn{padding:8px 10px}
  .fv{min-height:42px}
  .fi .fh .when{margin-left:0;width:100%}
  .modal{padding:16px;max-height:calc(100vh - 24px)}
  .mfoot .btn{flex:1 1 auto;justify-content:center;padding:10px}
  h1{font-size:24px}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card>.ch{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.card>.cb{padding:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted)}
.fv{border:1px solid var(--line);border-radius:5px;min-height:38px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;padding:0 8px;text-align:center}
.fv.st{padding:0}
.fv.ro{cursor:default;background:var(--surface-2)}
.fv.wide{grid-column:1/-1}
.field.wide{grid-column:1/-1}
.fv.long{justify-content:flex-start;text-align:left;white-space:pre-wrap;padding:8px;align-items:flex-start;min-height:60px}
.feed{display:flex;flex-direction:column;gap:10px}
.fi{border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:var(--surface)}
.fi .fh{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.fi .fh .when{margin-left:auto}
.fi .tx{white-space:pre-wrap;margin-top:6px;line-height:1.5}
.fi.sys{background:none;border-style:dashed;padding:7px 12px}
.fi.ai{border-color:var(--accent)}
.pill{font-size:11.5px;color:#fff;padding:1px 7px;border-radius:3px;font-weight:600}
.pill.dark{color:#262a33}
.compose textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:64px;background:var(--surface);resize:vertical}
.rel{display:flex;flex-direction:column}
.rel .rr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.rel .rr:last-child{border-bottom:0}
.rel .rr .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subi{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.subi .n{flex:1}
.subi.done .n{text-decoration:line-through;color:var(--muted)}
.mini{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.mini th,.mini td{border-bottom:1px solid var(--line);padding:6px;text-align:left;font-size:13px}
.mini th{color:var(--muted);font-weight:500}
.mini input,.mini select{border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--surface);width:100%;min-width:80px}
/* Startseite & Dashboard */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.kpi .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 90px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hbar .tr{height:16px;background:var(--line-2);border-radius:3px;overflow:hidden}
.hbar .fl{height:100%;border-radius:3px}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.list .li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
.list .li:last-child{border-bottom:0}
.list .li .n{flex:1;min-width:0}
.list .li .n b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);padding:10px 0;font-size:13px}
.vbars{display:flex;gap:8px;align-items:flex-end;height:150px;padding-top:10px}
.vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.vbars .vb .b{width:100%;max-width:46px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.vbars .vb .x{font-size:11px;color:var(--muted)}
.vbars .vb .y{font-size:11px;font-variant-numeric:tabular-nums}
/* Automationen, Sequenzen */
.rule{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .tx{flex:1;min-width:0;line-height:1.5}
.rule .tx b{font-weight:600}
.switch{width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--accent)}
.switch.on::after{left:18px}
.step{display:grid;grid-template-columns:70px 130px minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-2)}
@media (max-width:640px){.step{grid-template-columns:1fr 1fr}}
.step input,.step select,.step textarea{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--surface);width:100%}
.step textarea{min-height:90px;grid-column:1/-1}
/* Chat */
.chat{display:flex;flex-direction:column;gap:10px;max-width:820px}
.msg{padding:10px 14px;border-radius:10px;white-space:pre-wrap;line-height:1.55;max-width:90%}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg)}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg.t{align-self:flex-start;font-size:12px;color:var(--muted);padding:2px 4px}
.chatin{display:flex;gap:8px;max-width:820px;margin-top:14px}
.chatin textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:52px;background:var(--surface);resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast button{color:var(--bg);font-weight:700;text-decoration:underline}
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:55;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;display:flex;align-items:center;gap:2px;padding:6px;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.bulk .n{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:6px 10px;font-weight:700;margin-right:6px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-weak);color:var(--fg)}
.scanraw{white-space:pre-wrap;font-size:12px;color:var(--muted);max-height:180px;overflow:auto;background:var(--surface-2);border-radius:5px;padding:8px;margin:6px 0 0}
.formview{max-width:560px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.aiout{white-space:pre-wrap;line-height:1.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function normalizeCfg(c){
  const d=defaultCfg(); if(!c||typeof c!=='object') return d;
  const out=JSON.parse(JSON.stringify(c));
  out.boards=out.boards||{};
  // Version 2: Deals werden zu Projekten, Kontakte bekommen Kandidaten-Felder
  if((out.ver||1)<2){
    for(const b of ['deals','contacts']) if(out.boards[b]){const custom=(out.boards[b].columns||[]).filter(x=>x.custom);out.boards[b].columns=d.boards[b].columns.concat(custom);out.boards[b].removed=[]}
    if(out.boards.deals) out.boards.deals.groups=d.boards.deals.groups;
    if(out.boards.accounts){const x=(out.boards.accounts.columns||[]).find(x=>x.id==='deals');if(x)x.name='Projekte'}
    if(Array.isArray(out.automations)) out.automations=out.automations.filter(r=>r.board!=='deals').concat(d.automations.filter(r=>r.board==='deals'));
    out.ver=2;
  }
  // Version 3: Anrede, Akad. Titel, Vorname, Nachname vorne bei Leads und Kontakten
  if(out.ver<3){
    for(const b of PERSON_BOARDS_CFG) if(out.boards[b]){
      const cs=(out.boards[b].columns||[]).filter(x=>!['akad','vorname','nachname','salutation'].includes(x.id));
      const sal=(out.boards[b].columns||[]).find(x=>x.id==='salutation')||{id:'salutation',name:'Anrede',type:'status',labels:SAL};
      const at=b==='leads'?Math.max(0,cs.findIndex(x=>x.id==='status')+1):0;
      cs.splice(at,0,sal,...NAME_COLS()); out.boards[b].columns=cs;
    }
    out.ver=3;
  }
  // Version 4: Kunde direkt nach dem Projekt, Projektnummer vor dem Namen statt eigener Spalte, Typ „Kandidat“
  if(out.ver<4){
    const dc=out.boards.deals&&out.boards.deals.columns;
    if(dc){const acc=dc.find(x=>x.id==='account');if(acc){dc.splice(dc.indexOf(acc),1);dc.unshift(acc)}const nr=dc.find(x=>x.id==='nr');if(nr)nr.hidden=true}
    const typ=out.boards.contacts&&(out.boards.contacts.columns||[]).find(x=>x.id==='typ');
    if(typ&&!typ.labels.some(l=>l.id==='kand')) typ.labels.push(L('kand','Kandidat','purple'));
    out.ver=4;
  }
  // Version 5: Feld „Mobil“ direkt nach Telefon
  if(out.ver<5){
    for(const b of PERSON_BOARDS_CFG) if(out.boards[b]){const cs=out.boards[b].columns||[];if(!cs.some(x=>x.id==='mobile')){const i=cs.findIndex(x=>x.id==='phone');cs.splice(i<0?cs.length:i+1,0,{id:'mobile',name:'Mobil',type:'phone',hidden:true})}}
    out.ver=5;
  }
  // Version 6: bei Kontakten Typ und Priorität direkt nach der Position
  if(out.ver<6){
    const cs=out.boards.contacts&&out.boards.contacts.columns;
    if(cs){const mv=['typ','prio'].map(id=>cs.find(x=>x.id===id)).filter(Boolean);mv.forEach(x=>cs.splice(cs.indexOf(x),1));const i=cs.findIndex(x=>x.id==='title');cs.splice(i<0?cs.length:i+1,0,...mv)}
    out.ver=6;
  }
  for(const b of BOARDS_ORDER){
    const bd=out.boards[b]||(out.boards[b]=d.boards[b]);
    bd.groups=Array.isArray(bd.groups)&&bd.groups.length?bd.groups:d.boards[b].groups;
    bd.columns=Array.isArray(bd.columns)?bd.columns:[];
    for(const dc of d.boards[b].columns){ if(!bd.columns.some(x=>x.id===dc.id)&&!(bd.removed||[]).includes(dc.id)) bd.columns.push(dc) }
  }
  for(const k of ['automations','templates','sequences']) if(!Array.isArray(out[k])) out[k]=d[k];
  out.flags=Object.assign({},d.flags,out.flags||{});
  out.mailSync=Object.assign({},d.mailSync,out.mailSync||{});
  return out;
}

function computed(b,it,col){

    case 'forecast': {const v=+it.v.value||0,p=+it.v.prob||0;return Math.round(v*p/100)}
    case 'dauer': {const s=it.v.order;if(!s)return '';const e=['won','lost'].includes(it.v.stage)&&it.v.close?it.v.close:todayISO();const d=Math.round((new Date(e)-new Date(s))/864e5);return d<0||isNaN(d)?'':d}
    case 'folder': return [it.v.nr,companyOf('deals',it)].filter(Boolean).join(' ')+' – '+it.name;
    case 'quotes': return (it.quotes||[]).length;
    case 'timeline': return actsOf(b,it.id).length;

function sortVal(b,it,col){

// Leads und Kontakte: Name = Akad. Titel + Vorname + Nachname; ein direkt eingegebener Name wird aufgeteilt
const PERSON_BOARDS=['leads','contacts'];
const AKAD_RE=/^(prof\.?|dr\.?(-ing\.?)?|dipl\.?-\S*|mba|ing\.?)$/i;
const PARTIKEL=new Set(['von','van','de','der','den','zu','vom','zum','ten','di','da','la','le']);
function splitName(full){
  const t=String(full||'').trim().split(/\s+/).filter(Boolean); const akad=[];
  while(t.length>1&&AKAD_RE.test(t[0])) akad.push(t.shift());
  if(!t.length) return {akad:akad.join(' '),vorname:'',nachname:''};
  let i=t.length-1; while(i>1&&PARTIKEL.has(t[i-1].toLowerCase())) i--;
  return {akad:akad.join(' '),vorname:t.slice(0,i).join(' '),nachname:t.slice(i).join(' ')};
}

function contactDupes(l){

  modal('Mögliches Duplikat gefunden',`<p class="hint" style="margin-top:0">„${esc(l.name)}“ gibt es möglicherweise schon als Kontakt. Beim Zusammenführen werden leere Felder ergänzt, abweichende nur, wenn du sie anhakst. Aktivitäten und Notizen des Leads hängen danach am bestehenden Kontakt.</p>
   <div>${dupes.map(({c,why},i)=>`<label class="row"><input type="radio" name="dup" value="${esc(c.id)}" ${i?'':'checked'}><span style="flex:1;min-width:0"><b>${esc(c.name)}</b><br><span class="small muted">${esc([c.v.email,companyOf('contacts',c),c.v.title].filter(Boolean).join(' · '))}</span></span><span class="badge">${esc(why.join(', '))}</span></label>`).join('')}</div>
   <h3 style="font-size:13px;margin:14px 0 6px">Angaben aus dem Lead</h3><div data-diff></div>
   <div class="mfoot"><button class="btn out" data-x>Abbrechen</button><button class="btn out" data-new>Trotzdem neu anlegen</button><button class="btn pri" data-merge>Zusammenführen</button></div>`,m=>{
    draw(m);
    m.querySelectorAll('input[name=dup]').forEach(r=>r.onchange=()=>{sel=r.value;draw(m)});
    m.querySelector('[data-x]').onclick=closeModal;
    m.querySelector('[data-new]').onclick=()=>{closeModal();convertLead(l.id,{force:true})};
    m.querySelector('[data-merge]').onclick=()=>{const f=[...m.querySelectorAll('[data-f]:checked')].map(x=>x.dataset.f);closeModal();convertLead(l.id,{into:sel,fields:f})};
  });
}
// opt.into: in bestehenden Kontakt zusammenführen (opt.fields = zu überschreibende Felder)
// opt.force: ohne Duplikatprüfung neu anlegen; opt.silent: keine Rückfragen (Mehrfachauswahl)
function convertLead(id,opt={}){
  const l=get('leads',id); if(!l) return null;
  if(l.v.converted&&get('contacts',l.v.converted)) return get('contacts',l.v.converted);
  if(!opt.force&&!opt.into){
    const d=contactDupes(l);
    if(d.length){
      // ohne Rückfrage nur bei eindeutig gleicher E-Mail zusammenführen, sonst überspringen
      if(opt.silent){const e=d.find(x=>x.why.includes('gleiche E-Mail'));return e?convertLead(id,{...opt,into:e.c.id,fields:[]}):null}
      dupModal(l,d); return null;
    }
  }
  const into=opt.into?get('contacts',opt.into):null; if(opt.into&&!into) return null;
  const comp=(l.v.company||'').trim(); let acc=comp?findAccount(comp):null;
  // beim Zusammenführen keinen neuen Kunden anlegen, wenn der Kontakt schon einem Kunden zugeordnet ist
  if(comp&&!acc&&!(into&&(into.v.accounts||[]).length)) acc=newItem('accounts',comp,'u',{});
  let c;
  if(into){
    c=into;
    for(const k of L2C){const lv=l.v[k];if(lv&&(!c.v[k]||(opt.fields||[]).includes(k)))c.v[k]=lv}
    if(acc&&!(c.v.accounts||[]).includes(acc.id)) c.v.accounts=[...(c.v.accounts||[]),acc.id];
    if(l.v.notes&&!String(c.v.comments||'').includes(l.v.notes)) c.v.comments=[c.v.comments,'Aus Lead: '+l.v.notes].filter(Boolean).join('\n\n');
    if((l.v.last||'')>(c.v.last||'')) c.v.last=l.v.last;
    c.updated=nowISO(); addUpdate(c,'sys',`Lead „${l.name}“ zusammengeführt`); persist('contacts',c.id);
  } else {
    c=newItem('contacts',l.name,'aktiv',{...(l.v.vorname||l.v.nachname?{akad:l.v.akad||'',vorname:l.v.vorname||'',nachname:l.v.nachname||''}:splitName(l.name)),salutation:l.v.salutation||'',email:l.v.email||'',phone:l.v.phone||'',mobile:l.v.mobile||'',title:l.v.title||'',linkedin:l.v.linkedin||'',typ:'qlead',prio:'mittel',accounts:acc?[acc.id]:[],last:l.v.last||'',comments:l.v.notes||''});
    addUpdate(c,'sys','Aus Lead übernommen');persist('contacts',c.id);
  }
  for(const a of actsOf('leads',id)){const r=new Set(a.v.rel||[]);r.add('contacts:'+c.id);a.v.rel=[...r];persist('activities',a.id)}
  l.v.converted=c.id; l.group='konv'; if(l.v.status!=='qual'){addUpdate(l,'change','Status: → Qualifiziert');l.v.status='qual'}
  addUpdate(l,'sys','In Kontakte übernommen'); persist('leads',id);
  if(!opt.silent) toast(`${l.name} ist jetzt Kontakt`,'Öffnen',()=>openDetail('contacts',c.id));
  render(); return c;
}

/* ---------- Automationen ---------- */
function runAutos(b,id,c,val,depth){
  if(depth>4) return;
  for(const r of S.cfg.automations){
    if(!r.on||r.board!==b||r.col!==c||r.value!==val) continue;
    const a=r.act;
    try{
      if(a.type==='group') moveGroup(b,id,a.group);
      else if(a.type==='set') setVal(b,id,a.col,a.value,{depth,noRender:true});
      else if(a.type==='activity'){createActivity({title:a.title+': '+nameOf(b,id),atype:a.atype||'task',start:localDT(addDays(new Date(),+a.days||0).setHours(9,0,0,0)),rel:[b+':'+id]})}
      else if(a.type==='convert'&&b==='leads') convertLead(id);
      else if(a.type==='sequence') enroll(b,id,a.seq,todayISO());
    }catch(e){console.error(e)}
  }
}
function autoText(r){
  const bm=BOARD_META[r.board]; const col=colById(r.board,r.col); const lb=labelOf(r.board,r.col,r.value);
  const a=r.act; let act='';

/* ---------- Sequenzen & Vorlagen ---------- */
function fill(tpl,b,it){
  const nm=it&&(it.v.vorname||it.v.nachname)?{akad:it.v.akad||'',vorname:it.v.vorname||'',nachname:it.v.nachname||''}:splitName(it?it.name:'');

  // Unternehmen/Projekt oder mehrere Empfänger: neutrale Anrede
  const brief=sal&&nm.nachname?(sal.id==='frau'?`Sehr geehrte Frau ${nn}`:`Sehr geehrter Herr ${nn}`):person?`Guten Tag ${it.name}`:'Guten Tag';
  const map={Vorname:person?nm.vorname:'',Nachname:person?nm.nachname:'',Name:it?it.name:'',Anrede:sal?sal.name:'',Briefanrede:brief,Unternehmen:companyOf(b,it)||'Ihrem Unternehmen',Titel:it&&it.v.title||''};
  return String(tpl||'').replace(/\{\{(\w+)\}\}/g,(m,k)=>k in map?map[k]:m);
}
function enroll(b,id,sid,start){

  it.seq={sid,name:s.name,start}; addUpdate(it,'sys',`Sequenz „${s.name}“ gestartet (${s.steps.length} Schritte)`); persist(b,id);
  for(const a of items('activities')) if(a.seq===sid&&(a.v.rel||[]).includes(b+':'+id)) persist('activities',a.id);
  render();
}
function stopSeq(b,id){
  const it=get(b,id); if(!it||!it.seq) return; const sid=it.seq.sid;
  for(const a of actsOf(b,id)) if(a.seq===sid&&a.v.astatus==='offen'){a.v.astatus='cancel';persist('activities',a.id)}

}

/* ---------- Outlook-Abgleich ---------- */
// Liest E-Mails von/an Adressen der Leads und Kontakte aus Outlook und legt sie als erledigte Aktivität an.
// Doppelte werden über die Message-ID (v.olid) erkannt; Kontakte haben Vorrang vor Leads mit gleicher Adresse.
let mailSyncing=false;
async function mailSync(opt={}){
  const ms=S.cfg.mailSync;
  // automatisch nur am PC, damit PC und Handy nicht doppelt abgleichen
if(mailSyncing||!S.mcp||!S.mcp.sync||S.conn!=='ok'||(!opt.manual&&(!ms.on||(window.CRM_REMOTE&&!window.CRM_M365)))) return;
  const book=new Map();
  for(const it of items('contacts')){const e=String(it.v.email||'').trim().toLowerCase();if(e.includes('@'))book.set(e,[...(book.get(e)||[]),'contacts:'+it.id])}
  for(const it of items('leads')){const e=String(it.v.email||'').trim().toLowerCase();if(!e.includes('@')||(it.v.converted&&get('contacts',it.v.converted)))continue;const cur=book.get(e)||[];if(!cur.some(x=>x.startsWith('contacts:')))book.set(e,[...cur,'leads:'+it.id])}
  if(!book.size){if(opt.manual)toast('Bei keinem Lead oder Kontakt ist eine E-Mail-Adresse hinterlegt.');return}
  const now=new Date();
  const since=opt.days?addDays(now,-opt.days):ms.last?addDays(new Date(ms.last),-1):addDays(now,-30);
  mailSyncing=true; if(opt.manual) toast('Outlook wird abgeglichen…');
  try{
    const r=await S.mcp.sync({since:since.toISOString(),addrs:[...book.keys()]});
    const known=new Set(items('activities').map(a=>a.v.olid).filter(Boolean));
    let n=0;
    for(const m of r.mails||[]){
      if(!m.id||known.has(m.id)) continue; known.add(m.id);
      const to=[].concat(m.to||[]).map(x=>String(x).toLowerCase());
      const rel=[...new Set((m.dir==='in'?[m.from]:to).flatMap(a=>book.get(a)||[]))]; if(!rel.length) continue;
      const subj=m.subject||'(ohne Betreff)';
      // Über das CRM verschickte Mail ist schon protokolliert: nur die Outlook-ID ergänzen
      const dup=m.dir==='out'&&items('activities').find(a=>a.v.atype==='mail'&&!a.v.olid&&(a.v.rel||[]).some(x=>rel.includes(x))&&a.name.endsWith(subj)&&Math.abs(new Date(a.v.start)-new Date(m.date))<2*864e5);
      if(dup){dup.v.olid=m.id;persist('activities',dup.id);continue}
      const names=rel.map(x=>{const [rb,rid]=x.split(':');return nameOf(rb,rid)}).join(', ');
      const a=newItem('activities',(m.dir==='in'?'E-Mail von ':'E-Mail an ')+names+': '+subj,'erl',{atype:'mail',astatus:'done',start:m.date,rel,owner:'SB',olid:m.id,notes:`${m.dir==='in'?'Von: '+m.from:'An: '+to.join(', ')}\n\n${m.text||''}`});
      a.updates[0].text='Aus Outlook übernommen'; persist('activities',a.id);
      const day=String(m.date).slice(0,10);
      for(const x of rel){const [rb,rid]=x.split(':');const t=get(rb,rid);if(t&&colById(rb,'last')&&day>(t.v.last||'')){t.v.last=day;persist(rb,rid)}}
      n++;
    }
    ms.last=now.toISOString(); ms.lastCount=n; ms.lastError=''; saveCfg(); render();
    if(n||opt.manual) toast(n?`${n} ${n===1?'E-Mail':'E-Mails'} aus Outlook zugeordnet`:'Keine neuen E-Mails von oder an Leads und Kontakte');
  }catch(e){ms.lastError=(e&&e.text)||'Outlook hat nicht reagiert';render();if(opt.manual)toast('Abgleich fehlgeschlagen: '+ms.lastError)}
  finally{mailSyncing=false}
}

/* ---------- Visitenkarte / E-Mail einlesen ---------- */
// Erkennt Kontaktdaten regelbasiert aus Text (Visitenkarte per Texterkennung, E-Mail-Signatur, eingefügter Text)
// Eigene Adressen (Firmen-Domains); private Adressen ergänzt die PC-Version über window.CRM_OWN_MAILS (nicht im veröffentlichten Code)
const OWN_MAIL=new RegExp('('+['svenbraun\\.de','bgh-consulting\\.de'].concat(window.CRM_OWN_MAILS||[]).join('|')+')','i');
const FREEMAIL=/@(gmail|googlemail|gmx|web|t-online|outlook|hotmail|live|yahoo|icloud|me|mail|aol|freenet|posteo|mailbox)\./i;
const POS_RE=/(geschäftsführ|gesellschafter|inhaber|vorstand|vorsitz|direktor|director|leiter|leitung|head of|manager|managing|chief|\bceo\b|\bcfo\b|\bcoo\b|\bcto\b|\bcio\b|\bchro\b|president|präsident|prokurist|\bpartner\b|referent|berater|consultant|officer|\bvp\b|personal|\bhr\b|human resources|vertrieb|sales|einkauf|founder|gründer|owner|assistenz|sekretariat)/i;
const COMP_RE=/(\bgmbh\b|\bmbh\b|\bag\b|\bse\b|\bkg\b|\bkgaa\b|\bohg\b|\bgbr\b|\bug\b|e\.\s?v\.|holding|\bgroup\b|gruppe|\binc\b|\bltd\b|\bllc\b|\bs\.a\.|\bb\.v\.|& co)/i;
const STREET_RE=/^[A-ZÄÖÜ][\wäöüß .'-]*\s\d+\s?[a-zA-Z]?(\s?[-\/]\s?\d+[a-zA-Z]?)?$/;
// Zeile sieht aus wie ein Personenname (2–5 großgeschriebene Wörter, keine Ziffern, keine Überschrift)
const NAME_STOP=/^(lebenslauf|curriculum|vitae|persönliche|persönlich|daten|kontakt|kontaktdaten|profil|kurzprofil|berufserfahrung|beruflicher|werdegang|ausbildung|kenntnisse|sprachen|anschrift|adresse|seite|bewerbung|anlage|zeugnis|sehr|liebe|lieber|mit|viele|beste|freundliche)$/i;
function isNameLine(l){
  const w=l.replace(/^(herr|frau)\s+/i,'').split(' ');
  return w.length>=2&&w.length<=5&&!/[\d@:|]/.test(l)&&!COMP_RE.test(l)&&!POS_RE.test(l)&&!STREET_RE.test(l)&&!w.some(x=>NAME_STOP.test(x.replace(/[^\wäöüß]/gi,'')))&&w.every(x=>/^[A-ZÄÖÜ]/.test(x)||AKAD_RE.test(x)||PARTIKEL.has(x.toLowerCase()));
}
// Lebenslauf: Name oben bzw. „Name:“, aktuelle Position und Arbeitgeber aus dem Abschnitt Berufserfahrung,
// Anschrift als Privatadresse (nicht beim Arbeitgeber)
function parseCV(text){
  const r=parseContact(text,{}); const fallback={title:r.title,company:r.company};
  const lines=String(text).split('\n').map(s=>s.replace(/[\t ]+/g,' ').trim()).filter(Boolean);
  const lab=String(text).match(/^\s*(?:name|vor-?\s*und\s*nachname)\s*[:\t]\s*(.+)$/im);
  const nameLine=lab?lab[1].trim():(lines.slice(0,20).find(isNameLine)||'');
  Object.assign(r,{salutation:'',akad:'',vorname:'',nachname:''},splitName(nameLine.replace(/^(herr|frau)\s+/i,'')));
  const sal=String(text).match(/\b(Herr|Frau)\b/); if(sal&&/^(herr|frau)\s/i.test(nameLine)) r.salutation=/frau/i.test(sal[1])?'frau':'herr';
  const i=lines.findIndex(l=>/^(berufserfahrung|beruflicher werdegang|berufliche (stationen|erfahrung|laufbahn)|werdegang|praxiserfahrung|work experience|professional experience|experience)\b/i.test(l));
  const sec=i>=0?lines.slice(i+1,i+15):[];
  const strip=s=>s.replace(/^(seit\s+)?\d{1,2}[\/.]?\d{0,2}[\/.]?\d{2,4}\s*([-–]\s*(\d{1,2}[\/.]\d{2,4}|\d{4}|heute|today|dato|jetzt))?\s*[:|]?\s*/i,'').trim();
  const pl=sec.map(strip).find(l=>POS_RE.test(l)&&l.length<110&&!/@/.test(l));
  r.title=pl?(pl.split(/\s*[,|·]\s*|\s+[-–]\s+|\s+bei\s+/).find(s=>POS_RE.test(s))||pl).trim():fallback.title;
  const cl=sec.map(strip).find(l=>COMP_RE.test(l)&&l.length<110);
  r.company=cl?(cl.split(/\s*[,|·]\s*|\s+[-–]\s+|\s+bei\s+/).find(s=>COMP_RE.test(s))||cl).trim():fallback.company;
  r.privAddr=[r.street,[r.zip,r.city].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  r.street=r.zip=r.city=''; r.website=''; r.cv=true;
  return r;
}
function signatureBlock(body){
  let t=String(body||'').replace(/\r/g,'');
  const q=t.search(/^\s*(von:|from:|gesendet:|sent:|-{3,}\s*(original|ursprüngliche)|am .{5,80} schrieb|on .{5,80} wrote)/im); if(q>0) t=t.slice(0,q);
  const lines=t.split('\n'); let start=-1;
  lines.forEach((l,i)=>{if(/(grüße|grüßen|gruß|gruss|regards|herzlich|mfg|^--\s*$)/i.test(l))start=i});
  return (start>=0?lines.slice(start+1):lines.slice(-25)).join('\n');
}
function parseContact(raw,hint={}){
  const text=String(raw||'').replace(/\r/g,'');
  const lines=text.split('\n').map(s=>s.replace(/[\t ]+/g,' ').trim()).filter(Boolean);
  const r={salutation:'',akad:'',vorname:'',nachname:'',title:'',company:'',email:'',phone:'',mobile:'',linkedin:'',website:'',street:'',zip:'',city:''};
  const emails=(text.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g)||[]).filter(e=>!OWN_MAIL.test(e));
  r.email=String(hint.from&&!OWN_MAIL.test(hint.from)?hint.from:emails[0]||'').toLowerCase();
  const li=text.match(/(https?:\/\/)?([a-z]{2,3}\.)?linkedin\.com\/in\/[\w%-]+\/?/i); if(li) r.linkedin=/^http/i.test(li[0])?li[0]:'https://'+li[0];
  const web=(text.match(/\b(?:https?:\/\/)?www\.[\w-]+(?:\.[\w-]+)+/gi)||[]).find(u=>!/linkedin|xing|facebook|instagram|twitter|youtube|google/i.test(u));
  r.website=web?web:(r.email&&!FREEMAIL.test(r.email)?'www.'+r.email.split('@')[1]:'');
  // Telefon / Mobil (Fax und Datumsangaben überspringen)
  const phRe=/(tel(?:efon)?|phone|fon|mobil(?:e)?|handy|cell|fax|[tmf])?\.?\s*:?\s*((?:\+|00)\d[\d ()\/.-]{6,}\d|0\d[\d ()\/.-]{6,}\d)/gi; let m;
  while((m=phRe.exec(text))){
    const lab=(m[1]||'').toLowerCase(), num=m[2].replace(/\s+/g,' ').trim();
    // Datumsangaben und Zeiträume („01.02.1980“, „03/2019 – 05/2022“) sind keine Telefonnummern
    if(/^f/.test(lab)||/^\d{1,2}\.\d{1,2}\.\d{2,4}$/.test(num)||/^\d{1,2}[\/.](19|20)\d{2}\b/.test(num)||/\b(19|20)\d{2}\s*[-–]\s*(19|20)\d{2}\b/.test(num)||num.replace(/\D/g,'').length<7) continue;
    const mob=/^(m|mobil|mobile|handy|cell)/.test(lab)||/^(\+49|0049)?\s*\(?0?\)?\s*1[5-7]/.test(num.replace(/^0(?=1[5-7])/,''));
    if(mob){if(!r.mobile)r.mobile=num}else if(!r.phone) r.phone=num;
  }
  // Adresse: PLZ + Ort, Straße davor in derselben oder der vorherigen Zeile
  for(let i=0;i<lines.length&&!r.zip;i++){
    const a=lines[i].match(/\b(?:D-)?(\d{5})\s+([A-ZÄÖÜ][\wäöüß .\/-]{1,40})/); if(!a) continue;
    r.zip=a[1]; r.city=a[2].split(/[|·•,]/)[0].replace(/\s*(Germany|Deutschland)$/i,'').trim();
    const before=lines[i].slice(0,a.index).replace(/[\s,|·•-]+$/,'').split(/[|·•]/).pop().replace(/^(anschrift|adresse|address|wohnort|wohnhaft|privat)\s*:?\s*/i,'').trim();
    if(/\d/.test(before)&&/[a-zäöüß]/i.test(before)) r.street=before; else if(i>0&&STREET_RE.test(lines[i-1])) r.street=lines[i-1];
  }
  // Firma: Zeile mit Rechtsform
  const cl=lines.find(l=>COMP_RE.test(l)&&!/@|www\./i.test(l)&&l.length<90);
  if(cl) r.company=(cl.split(/[|·•]/).find(s=>COMP_RE.test(s))||cl).trim();
  // Name: Absendername der E-Mail, sonst erste Zeile, die wie ein Personenname aussieht
  let nameLine='';
  if(hint.fromName&&!/@/.test(hint.fromName)){let n=hint.fromName.replace(/["']/g,'').replace(/\(.*?\)/g,'').trim();if(/^[^,]+,\s*[^,]+$/.test(n))n=n.split(',').map(s=>s.trim()).reverse().join(' ');nameLine=n}
  if(!nameLine) nameLine=lines.find(isNameLine)||'';
  const sm=nameLine.match(/^(herr|frau)\s+/i)||text.match(/\b(Herr|Frau)\s+(?:(?:Prof|Dr)\.?\s+)*[A-ZÄÖÜ]/);
  if(sm) r.salutation=/frau/i.test(sm[1])?'frau':'herr';
  Object.assign(r,splitName(nameLine.replace(/^(herr|frau)\s+/i,'')));
  // Position
  const pl=lines.find(l=>POS_RE.test(l)&&l!==nameLine&&!/@|www\.|\d{4,}/i.test(l)&&l.length<90);
  if(pl) r.title=(pl.split(/[|·•]/).find(s=>POS_RE.test(s))||pl).trim();

// .eml: Absender und Textteil auslesen (quoted-printable / base64, Zeichensatz beachten)
function decodeWords(s){return String(s||'').replace(/=\?([^?]+)\?([bq])\?([^?]*)\?=/gi,(m,cs,enc,t)=>{try{const bytes=enc.toUpperCase()==='B'?Uint8Array.from(atob(t),c=>c.charCodeAt(0)):Uint8Array.from(t.replace(/_/g,' ').replace(/=([0-9a-f]{2})/gi,(x,h)=>String.fromCharCode(parseInt(h,16))),c=>c.charCodeAt(0));return new TextDecoder(cs).decode(bytes)}catch(e){return t}})}
function decodePart(body,enc,cs){
  let bin=body; enc=(enc||'').toLowerCase();
  if(enc==='base64'){try{bin=atob(body.replace(/\s+/g,''))}catch(e){}}
  else if(enc==='quoted-printable') bin=body.replace(/=\r?\n/g,'').replace(/=([0-9a-f]{2})/gi,(x,h)=>String.fromCharCode(parseInt(h,16)));
  try{return new TextDecoder(cs||'utf-8').decode(Uint8Array.from(bin,c=>c.charCodeAt(0)&255))}catch(e){return bin}
}
function parseEml(raw){
  const split=s=>{const i=s.search(/\r?\n\r?\n/);return i<0?[s,'']:[s.slice(0,i),s.slice(i).replace(/^\r?\n\r?\n/,'')]};
  const hdr=h=>{const o={};h.replace(/\r?\n[ \t]+/g,' ').split(/\r?\n/).forEach(l=>{const i=l.indexOf(':');if(i>0)o[l.slice(0,i).toLowerCase()]=l.slice(i+1).trim()});return o};
  const [h0,b0]=split(raw); const H=hdr(h0);
  const fromRaw=decodeWords(H.from||''); const fm=fromRaw.match(/^(.*?)\s*<([^>]+)>/);
  const find=(h,b)=>{const ct=h['content-type']||'text/plain';const bd=ct.match(/boundary="?([^";]+)"?/i);
    if(/multipart/i.test(ct)&&bd){let html='';for(const part of b.split('--'+bd[1]).slice(1)){const [ph,pb]=split(part.replace(/^\r?\n/,''));const P=hdr(ph);const r=find(P,pb);if(r&&r.plain)return r;if(r&&r.html)html=r.html}return {html}}
    const cs=(ct.match(/charset="?([^";]+)"?/i)||[])[1];const txt=decodePart(b,h['content-transfer-encoding'],cs);return /text\/html/i.test(ct)?{html:txt}:{plain:txt}};
  const r=find(H,b0); let body=r.plain||'';
  if(!body&&r.html){const d=new DOMParser().parseFromString(r.html.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|tr)>/gi,'\n'),'text/html');body=d.body.textContent||''}
  return {fromName:fm?fm[1].replace(/"/g,'').trim():'',from:fm?fm[2]:fromRaw.trim(),subject:decodeWords(H.subject||''),body};
}
// vCard (.vcf)
function parseVcf(raw){
  const r={salutation:'',akad:'',vorname:'',nachname:'',title:'',company:'',email:'',phone:'',mobile:'',linkedin:'',website:'',street:'',zip:'',city:''};
  const lines=String(raw).replace(/\r?\n[ \t]/g,'').split(/\r?\n/);
  const val=l=>l.slice(l.indexOf(':')+1).replace(/\\,/g,',').replace(/\\n/gi,' ').trim();
  for(const l of lines){const key=l.split(/[;:]/)[0].toUpperCase();
    if(key==='N'){const p=val(l).split(';');r.nachname=p[0]||'';r.vorname=p[1]||'';r.akad=p[3]||''}
    else if(key==='FN'&&!r.nachname) Object.assign(r,splitName(val(l)));
    else if(key==='ORG') r.company=val(l).split(';')[0];
    else if(key==='TITLE') r.title=val(l);
    else if(key==='EMAIL'&&!r.email) r.email=val(l).toLowerCase();
    else if(key==='TEL'){if(/CELL|MOBILE/i.test(l)){if(!r.mobile)r.mobile=val(l)}else if(!/FAX/i.test(l)&&!r.phone)r.phone=val(l)}
    else if(key==='ADR'&&!r.zip){const p=val(l).split(';');r.street=p[2]||'';r.city=p[3]||'';r.zip=p[5]||''}
    else if(key==='URL'){const u=val(l);if(/linkedin/i.test(u))r.linkedin=u;else if(!r.website)r.website=u}}
  return r;
}
// Bild verkleinern (max. 2400 px) und als PNG an die Texterkennung schicken
function imageToPng(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,2400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);c.toBlob(b=>b?res(b):rej({text:'Bild konnte nicht gelesen werden'}),'image/png')};img.onerror=()=>rej({text:'Dieses Bildformat kann der Browser nicht öffnen (bitte JPG oder PNG).'});img.src=URL.createObjectURL(file)})}
// Einheitliche Auswertung: liefert {r: erkannte Felder, raw: Rohtext, src: Quelle}
async function extractFile(f){
  const n=f.name.toLowerCase();
  if(/^image\//.test(f.type)||/\.(jpe?g|png|gif|bmp|webp)$/.test(n)){const j=await window.crmTools.ocr(await imageToPng(f));if(!j.text.trim())throw {text:'Auf dem Bild wurde kein Text erkannt. Bitte ein schärferes, gerades Foto verwenden.'};return {r:parseContact(j.text),raw:j.text,src:'Visitenkarte'}}
  if(/\.(pdf|docx?|rtf|odt)$/.test(n)){const j=await window.crmTools.doc(f);if(!j.text.trim())throw {text:'In der Datei wurde kein Text gefunden. Gescannte PDFs bitte als Bild (Foto/Screenshot) einlesen.'};return {r:parseCV(j.text),raw:j.text,src:'Lebenslauf'}}
  if(n.endsWith('.msg')) return extractMail(await window.crmTools.msg(f),'E-Mail');
  if(n.endsWith('.eml')){const e=parseEml(await f.text());return extractMail({fromName:e.fromName,from:e.from,body:e.body,to:[]},'E-Mail')}
  if(n.endsWith('.vcf')){const t=await f.text();return {r:parseVcf(t),raw:t,src:'vCard'}}
  return extractText(await f.text());
}
// Selbst geschriebene Mail: statt des eigenen Absenders den ersten fremden Empfänger nehmen
function extractMail(j,src){
  const own=(j.own||[]).map(x=>String(x).toLowerCase()); let fromName=j.fromName||'',from=j.from||'';
  if(OWN_MAIL.test(from)||own.includes(from.toLowerCase())){fromName='';from=(j.to||[]).find(x=>!OWN_MAIL.test(x)&&!own.includes(String(x).toLowerCase()))||''}
  return {r:parseContact(signatureBlock(j.body),{fromName,from}),raw:j.body,src};
}
// Eingefügter Text; beginnt er mit „Von: Name <adresse>“, gilt das als Absender
function extractText(t){
  if(/(lebenslauf|curriculum vitae|berufserfahrung|beruflicher werdegang)/i.test(t)) return {r:parseCV(t),raw:t,src:'Lebenslauf'};
  const fm=String(t).slice(0,600).match(/^\s*(?:von|from):\s*"?([^"<\n]*?)"?\s*<([^>\s]+@[^>\s]+)>/im);
  return {r:parseContact(signatureBlock(t),fm?{fromName:fm[1],from:fm[2]}:{}),raw:t,src:'eingefügtem Text'};
}

function wireDrop(dz,onFile,onText){

}

    if(o.privAddr){const f=b==='contacts'?'comments':'notes';if(!String(it.v[f]||'').includes(o.privAddr))it.v[f]=[it.v[f],'Privatadresse: '+o.privAddr].filter(Boolean).join('\n\n')}
    addUpdate(it,'sys','Aus Visitenkarte / E-Mail ergänzt'); it.updated=nowISO(); persist(b,it.id);
  } else {
    const v={...fields};
    if(b==='contacts'){v.accounts=acc?[acc.id]:[];v.prio='mittel';if(o.cand){v.typ='kand';v.kand='ja';v.kstatus='ident'}if(o.privAddr)v.comments='Privatadresse: '+o.privAddr}
    else {v.company=o.company;v.status='neu';v.notes=[o.website&&'Website: '+o.website,addr&&'Adresse: '+addr,o.privAddr&&'Privatadresse: '+o.privAddr].filter(Boolean).join('\n')}
    it=newItem(b,composeName(nm)||o.email,b==='leads'?'neu':'aktiv',v); addUpdate(it,'sys','Aus Visitenkarte / E-Mail angelegt'); persist(b,it.id);
  }
  closeModal(); render(); openDetail(b,it.id);
  toast(existingId?`${it.name} ergänzt`:`${it.name} als ${b==='leads'?'Lead':'Kontakt'} angelegt`);
}

/* ---------- Toast, Popover, Modal ---------- */
let toastT;
function toast(msg,actLabel,fn){
  const old=$('.toast'); if(old) old.remove(); clearTimeout(toastT);
  const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status');
  t.innerHTML=`<span>${esc(msg)}</span>`+(actLabel?`<button type="button">${esc(actLabel)}</button>`:'');
  if(actLabel) t.querySelector('button').onclick=()=>{t.remove();fn()};
  document.body.appendChild(t); toastT=setTimeout(()=>t.remove(),6000);
}
let POP=null;
function closePop(){if(POP){POP.el.remove();if(POP.onClose)POP.onClose();POP=null}}
function pop(anchor,html,mount,opts={}){
  closePop(); const el=document.createElement('div'); el.className='pop'; el.innerHTML=html; el.style.left='-9999px'; el.style.top='0'; document.body.appendChild(el);
  POP={el,anchor,onClose:opts.onClose}; if(mount) mount(el);
  const r=anchor.getBoundingClientRect(); const w=el.offsetWidth,h=el.offsetHeight;
  let left=Math.min(r.left,innerWidth-w-12); left=Math.max(12,left);
  let top=r.bottom+4; if(top+h>innerHeight-12) top=Math.max(12,r.top-h-4);
  el.style.left=left+'px'; el.style.top=top+'px';
  const f=el.querySelector('input[type=text],input[type=search],textarea'); if(f&&!opts.noFocus) f.focus();
  return el;
}
document.addEventListener('mousedown',e=>{if(POP&&!POP.el.contains(e.target)&&!POP.anchor.contains(e.target))closePop()});
document.addEventListener('keydown',e=>{if(e.target.classList&&e.target.classList.contains('inl'))return;if(e.key==='Escape'){if(POP)closePop();else if($('.modal'))closeModal();else if(UI.detail)closeDetail()}});
function closeModal(){document.querySelectorAll('.modal,.backdrop.m').forEach(e=>e.remove())}
function modal(title,body,mount){
  closeModal(); closePop();
  const bd=document.createElement('div'); bd.className='backdrop m'; bd.onclick=closeModal;
  const m=document.createElement('div'); m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
  m.innerHTML=`<h2>${esc(title)}</h2>${body}`; document.body.append(bd,m); if(mount) mount(m);
  const f=m.querySelector('input,textarea,select'); if(f) f.focus(); return m;
}

/* ---------- Zell-Rendering ---------- */
function lblHTML(l,tag='div'){

  return `<${tag} class="lbl ${DARKTXT.has(l.color)?'dark':''}" style="background:${colorOf(l.color)}">${esc(l.name)}</${tag}>`;

function chipsHTML(list,iconName,board){
  if(!list.length) return '';
  const shown=list.slice(0,2).map(x=>`<span class="chip${board?' link':''}" ${board?`data-act="open" data-b="${board}" data-id="${esc(x.id)}"`:''}>${iconName?ic(iconName):''}${esc(x.name)}</span>`).join('');
  return `<span class="chips">${shown}${list.length>2?`<span class="more">+${list.length-2}</span>`:''}</span>`;
}
const BICON={contacts:'person',accounts:'building',deals:'coin',leads:'person',activities:'activities'};
function cellInner(b,it,col){
  const v=it.v[col.id];
  switch(col.type){
    case 'status': return lblHTML(labelOf(b,col.id,v));
    case 'money': return esc(fmtMoney(v));
    case 'number': return esc(fmtNum(v));
    case 'percent': return v===''||v==null?'':esc(v+' %');
    case 'date': {const od=(col.id==='close'&&v&&v<todayISO()&&it.v.stage&&!['won','lost'].includes(it.v.stage));return `<span class="${od?'overdue':''}">${esc(fmtDate(v))}</span>`}
    case 'datetime': {const od=b==='activities'&&col.id==='start'&&it.v.astatus==='offen'&&v&&new Date(v)<new Date();return `<span class="${od?'overdue':''}">${esc(fmtDT(v))}</span>`}
    case 'email': case 'url': return v?`<span class="lnk">${esc(v)}</span>`:'';
    case 'person': return v?`<span class="chip" style="border-radius:50%;width:26px;height:26px;justify-content:center;background:var(--accent);color:var(--accent-fg);padding:0;font-weight:700;font-size:11px">${esc(v)}</span>`:`<span class="muted">${ic('person')}</span>`;
    case 'tags': return chipsHTML((v||[]).map(t=>({id:t,name:t})));
    case 'link': case 'rlink': return chipsHTML(linkIds(b,it,col).map(id=>({id,name:nameOf(col.target,id)})),BICON[col.target],col.target);
    case 'relany': return chipsHTML((v||[]).map(r=>{const [rb,rid]=r.split(':');return get(rb,rid)?{b:rb,id:rid,name:nameOf(rb,rid)}:null}).filter(Boolean).map(x=>({id:x.id,name:x.name,b:x.b})),null).replace(/<span class="chip"/g,'<span class="chip"');
    case 'dealsum': case 'forecast': {const n=computed(b,it,col);return n?esc(fmtMoney(n)):''}
    case 'dauer': {const n=computed(b,it,col);return n===''?'':esc(n>=14?`${Math.round(n/7)} Wochen (${n} Tage)`:`${n} ${n===1?'Tag':'Tage'}`)}
    case 'folder': return `<span class="small" title="Ordnername in 21 Mandate">${esc(computed(b,it,col))}</span>`;
    case 'quotes': {const n=computed(b,it,col);return n?`<span class="badge">${n} ${n===1?'Dokument':'Dokumente'}</span>`:''}
    case 'timeline': {const a=actsOf(b,it.id);const n=Math.min(a.length,14);let s='';for(let i=0;i<14;i++)s+=`<i class="${i<n?'f':''}"></i>`;return `<span class="tl" title="${a.length} Aktivitäten">${s}<button class="plus" data-act="addact" data-b="${b}" data-id="${esc(it.id)}" aria-label="Aktivität hinzufügen">${ic('plus')}</button></span>`}
    case 'convert': return v||it.v.converted?`<button class="convbtn done" data-act="open" data-b="contacts" data-id="${esc(it.v.converted)}">Übernommen</button>`:`<button class="convbtn" data-act="convert" data-id="${esc(it.id)}">Zu Kontakten</button>`;
    case 'seqs': return it.seq&&it.seq.name?`<span class="chip">${ic('seq')}${esc(it.seq.name)}</span>`:'';
    case 'longtext': return esc(String(v||'').split('\n')[0]);
    default: return esc(v??'');
  }
}
const RO_TYPES=new Set(['dealsum','forecast','quotes','timeline','convert','seqs','dauer','folder']);
function cellTD(b,it,col){
  const ro=RO_TYPES.has(col.type);

function inlineInput(anchor,type,value,commit){
  closePop(); const r=anchor.getBoundingClientRect();
  const inp=document.createElement('input'); inp.className='inl'; inp.type=type; inp.value=value??'';
  Object.assign(inp.style,{left:r.left+'px',top:r.top+'px',width:Math.max(r.width,type==='datetime-local'?220:140)+'px',height:r.height+'px'});
  document.body.appendChild(inp); inp.focus(); if(inp.select&&type==='text') inp.select();
  let done=false; const fin=save=>{if(done)return;done=true;const val=inp.value;inp.remove();UI.editing=false;if(save)commit(val);else render()};
  UI.editing=true;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')fin(true);if(e.key==='Escape')fin(false)});
  inp.addEventListener('blur',()=>fin(true));
}
function editCell(el,b,id,c){
  const it=get(b,id); if(!it) return;

  const T={text:'text',email:'email',phone:'tel',url:'text',number:'number',money:'number',percent:'number',date:'date',datetime:'datetime-local',person:'text'};
  if(T[col.type]){
    const init=col.type==='datetime'&&v?localDT(v):v;
    inlineInput(el,T[col.type],init,val=>{let out=val.trim();if(['number','money','percent'].includes(col.type))out=out===''?'':+out;if(col.type==='person')out=out.toUpperCase().slice(0,3);setVal(b,id,c,out)});return;
  }
  if(col.type==='longtext'){pop(el,`<h3>${esc(col.name)}</h3><textarea>${esc(v||'')}</textarea><div class="mfoot"><button class="btn pri" data-s>Speichern</button></div>`,p=>{const t=p.querySelector('textarea');p.querySelector('[data-s]').onclick=()=>{setVal(b,id,c,t.value);closePop()}});return}

  if(col.type==='tags'){tagPop(el,b,id,c);return}

function viewHome(){
  const now=new Date(); const eod=new Date();eod.setHours(23,59,59);
  const open=items('activities').filter(a=>a.v.astatus==='offen');
  const due=open.filter(a=>a.v.start&&new Date(a.v.start)<=eod).sort((x,y)=>String(x.v.start).localeCompare(y.v.start));
  const week=open.filter(a=>a.v.start&&new Date(a.v.start)>eod&&new Date(a.v.start)<=addDays(eod,7)).sort((x,y)=>String(x.v.start).localeCompare(y.v.start));

function demoBanner(){
  const n=BOARDS_ORDER.reduce((s,b)=>s+items(b).filter(x=>x.demo).length,0);
  if(!n) return '';
  return `<div class="banner" style="margin-top:14px"><span>Das CRM enthält ${n} Beispieleinträge (Google, Amazon, Apple, Bayer, Wella) aus der monday-Vorlage, damit du jede Funktion sofort ausprobieren kannst.</span><button class="btn out" data-act="cleardemo">Beispieldaten löschen</button></div>`;
}
function dealStats(){
  const ds=items('deals'); const act=ds.filter(d=>!['won','lost'].includes(d.v.stage));
  const won=ds.filter(d=>d.v.stage==='won'), lost=ds.filter(d=>d.v.stage==='lost');
  const sum=a=>a.reduce((s,d)=>s+(+d.v.value||0),0);
  const fc=act.reduce((s,d)=>s+(+d.v.value||0)*(+d.v.prob||0)/100,0);
  const y=String(new Date().getFullYear()); const wonY=won.filter(d=>String(d.v.close||d.updated).startsWith(y));
  return {act,won,lost,pipe:sum(act),fc,wonSum:sum(won),wonY:sum(wonY),rate:(won.length+lost.length)?Math.round(won.length/(won.length+lost.length)*100):null,avg:won.length?sum(won)/won.length:0};
}
function kpiStrip(){
  const s=dealStats(); const openA=items('activities').filter(a=>a.v.astatus==='offen');const od=openA.filter(a=>a.v.start&&new Date(a.v.start)<new Date()).length;
  return `<div class="kpis">

   <div class="kpi"><div class="k">Gewichtetes Honorar</div><div class="v">${fmtMoney(Math.round(s.fc))||'0 €'}</div><div class="s">Honorar × Wahrscheinlichkeit</div></div>
   <div class="kpi"><div class="k">Erfolgreich ${new Date().getFullYear()}</div><div class="v">${fmtMoney(s.wonY)||'0 €'}</div><div class="s">${s.won.length} erfolgreiche Projekte gesamt</div></div>
   <div class="kpi"><div class="k">Gewinnquote</div><div class="v">${s.rate==null?'–':s.rate+' %'}</div><div class="s">${s.won.length} gewonnen, ${s.lost.length} verloren</div></div>
   <div class="kpi"><div class="k">Offene Aktivitäten</div><div class="v">${openA.length}</div><div class="s ${od?'overdue':''}">${od} überfällig</div></div>
  </div>`;
}

function boardItems(b){
  let list=items(b);
  const qv=(UI.search[b]||'').trim().toLowerCase();
  if(qv) list=list.filter(it=>it.name.toLowerCase().includes(qv)||Object.values(it.v).some(v=>typeof v==='string'&&v.toLowerCase().includes(qv))||companyOf(b,it).toLowerCase().includes(qv));
  const f=UI.filter[b]||{};
  for(const [c,vals] of Object.entries(f)){ if(!vals||!vals.length) continue; list=list.filter(it=>vals.includes(c==='_group'?it.group:(it.v[c]||''))) }
  const s=UI.sort[b];
  if(s&&s.c){const col=s.c==='name'?null:colById(b,s.c);list.sort((x,y)=>{const a=sortVal(b,x,col),z=sortVal(b,y,col);return (a<z?-1:a>z?1:0)*(s.dir==='desc'?-1:1)})}
  else list.sort((x,y)=>String(x.created).localeCompare(String(y.created)));
  return list;
}

function viewTable(b){
  const list=boardItems(b); const vc=cols(b).filter(c=>!c.hidden); const gb=UI.groupBy[b];

  else groups=bcfg(b).groups.map(g=>({...g,items:list.filter(it=>it.group===g.id)}));
  const known=new Set(bcfg(b).groups.map(g=>g.id)); if(!gb){const orphan=list.filter(it=>!known.has(it.group));if(orphan.length)groups[0].items.push(...orphan)}

    const key=b+':'+g.id; const closed=UI.collapsed[key]; const gc=colorOf(g.color);

    if(closed) return `<div class="group">${header}</div>`;
    const ths=vc.map(c=>{const s=UI.sort[b];const arrow=s&&s.c===c.id?(s.dir==='desc'?' ↓':' ↑'):'';return `<th class="colh" data-act="colh" data-b="${b}" data-c="${c.id}">${esc(c.name)}${arrow}</th>`}).join('');

    const sums=vc.map(c=>`<td>${summaryCell(b,g.items,c)}</td>`).join('');
    return `<div class="group">${header}<div class="tw"><table class="bt" style="--gc:${gc}"><thead><tr><th><input type="checkbox" class="chk" data-act="selall" data-b="${b}" data-g="${esc(g.id)}" ${allSel?'checked':''} aria-label="Alle auswählen"></th><th style="text-align:left;padding-left:16px">${esc(bm.nameLabel)}</th>${ths}<th class="colh" data-act="addcol" data-b="${b}" aria-label="Spalte hinzufügen" style="min-width:44px">${ic('plus','').replace('<svg','<svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"')}</th></tr></thead>
     <tbody>${rows}<tr class="addrow"><td></td><td colspan="${vc.length+2}"><input data-addrow data-b="${b}" data-g="${esc(g.id)}" placeholder="+ ${esc(bm.item)} hinzufügen" aria-label="${esc(bm.item)} hinzufügen"></td></tr>
     <tr class="sumrow"><td></td><td></td>${sums}<td></td></tr></tbody></table></div></div>`;
  }).join('');
  return out+(gb?'':`<button class="btn out" data-act="addgroup" data-b="${b}">${ic('plus')} Neue Gruppe hinzufügen</button>`);
}
function summaryCell(b,list,c){
  if(!list.length) return '';
  if(c.type==='status'){const n=list.length;const counts={};list.forEach(it=>{const v=it.v[c.id]||'';counts[v]=(counts[v]||0)+1});return `<div class="distbar" title="${Object.entries(counts).map(([k,v])=>{const l=labelOf(b,c.id,k);return (l?l.name:'leer')+': '+v}).join(', ')}">${(c.labels||[]).concat([{id:'',color:'grey'}]).filter(l=>counts[l.id]).map(l=>`<span style="width:${counts[l.id]/n*100}%;background:${l.id?colorOf(l.color):'var(--line)'}"></span>`).join('')}</div>`}
  if(['money','dealsum','forecast'].includes(c.type)){const s=list.reduce((a,it)=>a+(+computed(b,it,c)||0),0);return `<div><b style="color:var(--fg)">${fmtMoney(s)}</b><div class="small">Summe</div></div>`}
  if(c.type==='number'){const s=list.reduce((a,it)=>a+(+it.v[c.id]||0),0);return `<div><b style="color:var(--fg)">${fmtNum(s)}</b><div class="small">Summe</div></div>`}
  if(c.type==='percent'){const v=list.filter(it=>it.v[c.id]!==''&&it.v[c.id]!=null);if(!v.length)return'';return `<div><b style="color:var(--fg)">${Math.round(v.reduce((a,it)=>a+ +it.v[c.id],0)/v.length)} %</b><div class="small">Durchschnitt</div></div>`}
  return '';
}

   <div class="card"><div class="ch"><h2>Leads nach Quelle</h2></div><div class="cb">${bySrc.map(x=>bar(x.l.name,x.n,maxL,colorOf(x.l.color),x.n)).join('')}</div></div>

function autoModal(r){
  const isNew=!r; r=r?JSON.parse(JSON.stringify(r)):{id:uid(),on:true,board:'deals',col:'stage',value:'won',act:{type:'group',group:'won'}};
  const draw=m=>{
    const stCols=cols(r.board).filter(c=>c.type==='status');
    if(!stCols.some(c=>c.id===r.col)) r.col=stCols[0]?stCols[0].id:'';
    const col=colById(r.board,r.col); if(col&&!col.labels.some(l=>l.id===r.value)) r.value=col.labels[0]?col.labels[0].id:'';
    const a=r.act; const setCols=cols(r.board).filter(c=>['status','number','percent','money'].includes(c.type));
    if(a.type==='set'&&!setCols.some(c=>c.id===a.col)) a.col=setCols[0]?setCols[0].id:'';
    const tc=a.type==='set'?colById(r.board,a.col):null;
    m.querySelector('[data-body]').innerHTML=`<div class="form">
     <label>Board<select data-f="board">${BOARDS_ORDER.map(b=>`<option value="${b}" ${b===r.board?'selected':''}>${BOARD_META[b].title}</option>`).join('')}</select></label>
     <div class="two"><label>Wenn Spalte<select data-f="col">${stCols.map(c=>`<option value="${c.id}" ${c.id===r.col?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
     <label>wechselt zu<select data-f="value">${(col?col.labels:[]).map(l=>`<option value="${esc(l.id)}" ${l.id===r.value?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label></div>
     <label>Dann<select data-f="type">${[['group','In Gruppe verschieben'],['set','Spalte setzen'],['activity','Aktivität anlegen'],['sequence','Sequenz starten']].concat(r.board==='leads'?[['convert','In Kontakte übernehmen']]:[]).map(([k,l])=>`<option value="${k}" ${k===a.type?'selected':''}>${l}</option>`).join('')}</select></label>
     ${a.type==='group'?`<label>Gruppe<select data-f="group">${bcfg(r.board).groups.map(g=>`<option value="${esc(g.id)}" ${g.id===a.group?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>`:''}
     ${a.type==='set'?`<div class="two"><label>Spalte<select data-f="setcol">${setCols.map(c=>`<option value="${c.id}" ${c.id===a.col?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Wert${tc&&tc.type==='status'?`<select data-f="setval">${tc.labels.map(l=>`<option value="${esc(l.id)}" ${l.id===a.value?'selected':''}>${esc(l.name)}</option>`).join('')}</select>`:`<input type="number" data-f="setval" value="${esc(a.value??'')}">`}</label></div>`:''}
     ${a.type==='activity'?`<div class="two"><label>Titel<input data-f="title" value="${esc(a.title||'Nachfassen')}"></label><label>In Tagen<input type="number" min="0" data-f="days" value="${esc(a.days??3)}"></label></div><label>Typ<select data-f="atype">${colById('activities','atype').labels.map(l=>`<option value="${esc(l.id)}" ${l.id===a.atype?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>`:''}
     ${a.type==='sequence'?`<label>Sequenz<select data-f="seq">${S.cfg.sequences.map(s=>`<option value="${esc(s.id)}" ${s.id===a.seq?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`:''}
    </div>`;
    m.querySelectorAll('[data-f]').forEach(x=>x.onchange=()=>{const f=x.dataset.f,v=x.value;
      if(f==='board'){r.board=v;r.col='';r.value='';r.act={type:'group',group:bcfg(v).groups[0].id}}
      else if(f==='col'){r.col=v;r.value=''}
      else if(f==='value') r.value=v;
      else if(f==='type'){r.act={type:v};if(v==='group')r.act.group=bcfg(r.board).groups[0].id;if(v==='activity'){r.act.title='Nachfassen';r.act.days=3;r.act.atype='task'}if(v==='sequence')r.act.seq=(S.cfg.sequences[0]||{}).id}
      else if(f==='group') a.group=v; else if(f==='setcol'){a.col=v;a.value=''} else if(f==='setval'){const t=colById(r.board,a.col);a.value=t&&t.type==='status'?v:+v}
      else if(f==='title') a.title=v; else if(f==='days') a.days=+v; else if(f==='atype') a.atype=v; else if(f==='seq') a.seq=v;
      if(['board','col','type','setcol'].includes(f)) draw(m)});
  };
  modal(isNew?'Neue Automation':'Automation bearbeiten',`<div data-body></div><div class="mfoot"><button class="btn out" data-x>Abbrechen</button><button class="btn pri" data-ok>Speichern</button></div>`,m=>{draw(m);m.querySelector('[data-x]').onclick=closeModal;m.querySelector('[data-ok]').onclick=()=>{if(r.act.type==='set'&&!colById(r.board,r.act.col)){toast('Bitte eine Spalte wählen.');return}const i=S.cfg.automations.findIndex(x=>x.id===r.id);if(i>=0)S.cfg.automations[i]=r;else S.cfg.automations.push(r);saveCfg();closeModal();render()}});
}

function itemBrief(b,it,full){
  const out={board:BOARD_META[b].title,id:it.id,name:it.name,gruppe:(bcfg(b).groups.find(g=>g.id===it.group)||{}).name};
  for(const c of cols(b)){
    let v;
    if(c.type==='status'){const l=labelOf(b,c.id,it.v[c.id]);v=l?l.name:''}
    else if(c.type==='link'||c.type==='rlink') v=linkIds(b,it,c).map(id=>nameOf(c.target,id)).join(', ');
    else if(c.type==='relany') v=(it.v.rel||[]).map(r=>{const [rb,rid]=r.split(':');return nameOf(rb,rid)}).filter(Boolean).join(', ');
    else if(c.type==='timeline') continue;
    else if(RO_TYPES.has(c.type)) v=computed(b,it,c);
    else v=it.v[c.id];
    if(v!==''&&v!=null&&!(Array.isArray(v)&&!v.length)) out[c.name]=Array.isArray(v)?v.join(', '):v;
  }
  if(full){
    out.verlauf=(it.updates||[]).filter(u=>u.kind!=='sys').slice(0,25).map(u=>fmtRel(u.ts)+': '+u.text);
    out.aktivitaeten=actsOf(b,it.id).slice(0,25).map(a=>{const t=labelOf('activities','atype',a.v.atype),s=labelOf('activities','astatus',a.v.astatus);return `${fmtDT(a.v.start)} · ${t?t.name:''} · ${s?s.name:''} · ${a.name}${a.v.notes?' — '+String(a.v.notes).slice(0,400):''}`});
    if(b==='deals'&&(it.quotes||[]).length) out.angebote=it.quotes.map(q=>`${q.nr} ${q.title} ${fmtMoney(q.amount)} ${q.status}`);
    if(it.subitems&&it.subitems.length) out.unterelemente=it.subitems.map(s=>(s.done?'[x] ':'[ ] ')+s.name);
  }
  return out;
}
function findBoard(name){const n=String(name||'').toLowerCase();return BOARDS_ORDER.find(b=>b===n||BOARD_META[b].title.toLowerCase()===n||BOARD_META[b].item.toLowerCase()===n)}
function applyNamedValue(b,it,colName,value){
  const col=cols(b).find(c=>c.name.toLowerCase()===String(colName).toLowerCase()||c.id===colName);
  if(String(colName).toLowerCase()==='name'){setVal(b,it.id,'name',String(value));return 'ok'}
  if(!col) throw new Error('Spalte nicht gefunden: '+colName+'. Verfügbar: '+cols(b).map(c=>c.name).join(', '));
  if(RO_TYPES.has(col.type)) throw new Error('Spalte wird berechnet und ist nicht änderbar');
  let v=value;
  if(col.type==='status'){const l=col.labels.find(l=>l.name.toLowerCase()===String(value).toLowerCase());if(!l)throw new Error('Label unbekannt. Verfügbar: '+col.labels.map(l=>l.name).join(', '));v=l.id}
  else if(['number','money','percent'].includes(col.type)) v=+value;
  else if(col.type==='tags') v=Array.isArray(value)?value.map(String):String(value).split(',').map(s=>s.trim()).filter(Boolean);
  else if(col.type==='link'){const names=Array.isArray(value)?value:String(value).split(',');v=names.map(n=>{n=String(n).trim();const t=items(col.target).find(x=>x.name.toLowerCase()===n.toLowerCase());return t?t.id:newItem(col.target,n).id})}
  else if(col.type==='rlink') throw new Error('Diese Verknüpfung bitte von der anderen Seite setzen');
  else v=String(value);
  setVal(b,it.id,col.id,v); return 'ok';
}
const AI_TOOLS=()=>[
 {name:'crm_suchen',description:'Durchsucht das CRM nach Namen und Feldinhalten. Gibt bis zu 15 Treffer mit Board, id, Name und Kernfeldern zurück. Ohne Suchbegriff: alle Elemente des Boards (max. 40).',inputSchema:{type:'object',properties:{suchbegriff:{type:'string'},board:{type:'string',description:'Leads, Kontakte, Kunden, Projekte oder Aktivitäten (optional)'}}},
  execute(i){const qv=String(i.suchbegriff||'').toLowerCase();const bs=i.board?[findBoard(i.board)].filter(Boolean):BOARDS_ORDER;const res=[];for(const b of bs)for(const it of items(b)){if(!qv||it.name.toLowerCase().includes(qv)||JSON.stringify(it.v).toLowerCase().includes(qv)||companyOf(b,it).toLowerCase().includes(qv))res.push(itemBrief(b,it,false))}return res.slice(0,qv?15:40)}},
 {name:'crm_element',description:'Liest ein Element vollständig inkl. Verlauf, Aktivitäten und Angeboten.',inputSchema:{type:'object',properties:{board:{type:'string'},id:{type:'string'}},required:['board','id']},
  execute(i){const b=findBoard(i.board);const it=b&&get(b,String(i.id));if(!it)throw new Error('Element nicht gefunden');return itemBrief(b,it,true)}},
 {name:'crm_feld_setzen',description:'Setzt ein Feld eines Elements. spalte = Spaltenname wie im CRM (z. B. "Projektstatus", "Honorar", "Abschlussdatum"). Status-Werte als Labelname, Datum als JJJJ-MM-TT, Verknüpfungen als Namen.',inputSchema:{type:'object',properties:{board:{type:'string'},id:{type:'string'},spalte:{type:'string'},wert:{}},required:['board','id','spalte','wert']},
  execute(i){const b=findBoard(i.board);const it=b&&get(b,String(i.id));if(!it)throw new Error('Element nicht gefunden');applyNamedValue(b,it,i.spalte,i.wert);addUpdate(it,'sys','Geändert durch KI-Assistent: '+i.spalte);persist(b,it.id);return 'gespeichert'}},
 {name:'crm_anlegen',description:'Legt ein neues Element an. felder = Objekt {Spaltenname: Wert}.',inputSchema:{type:'object',properties:{board:{type:'string'},name:{type:'string'},felder:{type:'object'}},required:['board','name']},
  execute(i){const b=findBoard(i.board);if(!b)throw new Error('Board unbekannt');const it=newItem(b,String(i.name));for(const [k,v] of Object.entries(i.felder||{}))applyNamedValue(b,it,k,v);addUpdate(it,'sys','Angelegt durch KI-Assistent');persist(b,it.id);return {id:it.id,board:BOARD_META[b].title}}},
 {name:'aktivitaet_anlegen',description:'Legt eine Aktivität an und verknüpft sie mit einem Element. typ: Telefonat, Meeting, E-Mail, LinkedIn, Aufgabe, Notiz. start als JJJJ-MM-TTTHH:MM (lokale Zeit). status: Offen oder Erledigt.',inputSchema:{type:'object',properties:{titel:{type:'string'},typ:{type:'string'},start:{type:'string'},status:{type:'string'},notizen:{type:'string'},board:{type:'string'},id:{type:'string'}},required:['titel']},
  execute(i){const tl=colById('activities','atype').labels.find(l=>l.name.toLowerCase()===String(i.typ||'Aufgabe').toLowerCase());const b=i.board?findBoard(i.board):null;const rel=b&&i.id&&get(b,String(i.id))?[b+':'+i.id]:[];const a=createActivity({title:String(i.titel),atype:tl?tl.id:'task',start:i.start||localDT(new Date()),status:String(i.status||'').toLowerCase()==='erledigt'?'done':'offen',rel,notes:String(i.notizen||'')});return {id:a.id}}},
 {name:'pipeline_kennzahlen',description:'Gibt Kennzahlen zurück: offene Pipeline, gewichteter Forecast, Gewinnquote, offene/überfällige Aktivitäten.',execute(){const s=dealStats();const o=items('activities').filter(a=>a.v.astatus==='offen');return {offenePipeline:s.pipe,forecast:Math.round(s.fc),gewonnenGesamt:s.wonSum,gewinnquote:s.rate,aktiveDeals:s.act.length,offeneAktivitaeten:o.length,ueberfaellig:o.filter(a=>a.v.start&&new Date(a.v.start)<new Date()).length}}}
];
function aiErr(e){const c=e&&e.code;return c==='not_granted'?'KI wurde für dieses CRM nicht freigegeben.':c==='rate_limited'?'Gerade zu viele Anfragen. Bitte später erneut versuchen.':c==='refused'?'Die Anfrage wurde abgelehnt. Bitte anders formulieren.':c==='cancelled'?'Abgebrochen.':'Die KI hat gerade nicht geantwortet. Bitte erneut versuchen.'}
let chatCtl=null;
async function sendChat(){
  const ta=$('#chatin'); if(!ta||!ta.value.trim()||!S.sample) return;
  UI.chat.push({role:'user',content:ta.value.trim()}); const draft={role:'assistant',content:'Denke nach…'}; UI.chat.push(draft); doRender();
  const rules=`Du bist der CRM-Assistent von Sven Braun (Executive Search, Besetzung von Führungspositionen, 100–250 T€). Antworte auf Deutsch, knapp und sachlich, ohne Floskeln. Nutze die Werkzeuge, um Daten zu lesen und zu ändern; erfinde keine Daten. Wenn Angaben fehlen, frag nach. Heute ist ${new Date().toLocaleString('de-DE')}. Boards: Leads, Kontakte, Kunden, Projekte, Aktivitäten.`;
  const turns=[{role:'user',content:rules},...UI.chat.filter(m=>m!==draft&&(m.role==='user'||m.role==='assistant')&&m.content!=='Denke nach…').slice(-12).map(m=>({role:m.role,content:m.content}))];
  chatCtl=new AbortController();
  try{
    const tools=AI_TOOLS().map(t=>({...t,execute:(inp,ctx)=>{const r=t.execute(inp,ctx);UI.chat.splice(UI.chat.indexOf(draft),0,{role:'tool',content:'↳ '+t.name.replace('_',' ')});doRender();return r}}));
    const {text}=await S.sample(turns,{tools,signal:chatCtl.signal,onText:({text})=>{draft.content=text;const c=$('#chat');if(c&&c.lastElementChild)c.lastElementChild.textContent=text}});
    draft.content=text;
  }catch(e){draft.content=(e&&e.text?e.text+'\n\n':'')+aiErr(e)}
  doRender();
}
async function aiCall(prompt,opts={}){
  if(!S.sample) throw {code:'not_granted'};
  return opts.json?S.sample.json(prompt,{cache:false,...opts.o}):S.sample(prompt,{cache:false,...opts.o});
}
